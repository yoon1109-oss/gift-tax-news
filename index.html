<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>모니터링</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b27;
      --card: #1c2133;
      --card-hover: #212840;
      --border: #2a3148;
      --accent: #4f9ef8;
      --accent-dim: rgba(79,158,248,.12);
      --text: #e8eaf0;
      --muted: #6b7490;
      --muted2: #8b93b0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

    header {
      padding: 0 48px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(15,17,23,0.96); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 9px; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2.5s infinite; }
    .help-link { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 600; line-height: 1; text-decoration: none; cursor: pointer; transition: all 0.15s; }
    .help-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 8px var(--accent)} 50%{opacity:.5;box-shadow:0 0 3px var(--accent)} }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .last-updated { font-size: 11px; color: var(--muted); }
    .refresh-btn {
      background: var(--accent-dim); border: 1px solid rgba(79,158,248,.3); color: var(--accent);
      padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
      display: flex; align-items: center; gap: 5px;
    }
    .refresh-btn:hover { background: rgba(79,158,248,.2); }
    .refresh-btn.loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .filters {
      padding: 10px 48px; display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .filter-label { font-size: 11px; color: var(--muted); margin-right: 4px; font-weight: 500; }
    .radio-wrap {
      display: flex; align-items: center; gap: 5px; cursor: pointer;
      font-size: 12px; font-weight: 500; color: var(--muted2);
      border: 1px solid var(--border); padding: 5px 13px; border-radius: 4px;
      transition: all 0.15s; user-select: none;
    }
    .radio-wrap:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .radio-wrap.checked { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .radio-wrap input[type="radio"] { display: none; }

    /* 블로그 키워드 칩 (블로그 탭에서만 노출) */
    .blog-keywords {
      padding: 9px 48px; display: none; align-items: center; gap: 6px;
      border-bottom: 1px solid var(--border); background: rgba(79,158,248,.04); flex-wrap: wrap;
    }
    .kw-chip {
      font-size: 12px; font-weight: 500; color: var(--muted2); cursor: pointer;
      border: 1px solid var(--border); padding: 5px 13px; border-radius: 14px;
      transition: all 0.15s; user-select: none;
    }
    .kw-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .kw-chip.active { border-color: var(--accent); color: var(--bg); background: var(--accent); }

    .stats-bar {
      padding: 8px 48px; display: flex; gap: 20px; align-items: center;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .stat { display: flex; align-items: baseline; gap: 4px; }
    .stat-num { font-size: 14px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--muted); }
    .loading-badge { font-size: 11px; color: var(--muted); display: none; align-items: center; gap: 5px; margin-left: auto; }
    .loading-badge.active { display: flex; }
    .mini-spinner { width: 11px; height: 11px; border: 1.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

    .news-container { padding: 20px 48px 60px; max-width: 780px; margin: 0 auto; }
    .news-grid { display: flex; flex-direction: column; gap: 8px; }

    /* 연관도 높음 섹션 */
    .related-section { margin-bottom: 16px; }
    .related-header {
      display: flex; align-items: center; gap: 8px;
      padding: 0 0 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px;
    }
    .related-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      color: #f9a26c; border: 1px solid rgba(249,162,108,.35);
      padding: 2px 7px; border-radius: 3px;
    }
    .related-label { font-size: 11px; color: var(--muted2); }
    .related-card {
      background: rgba(249,162,108,.05); border: 1px solid rgba(249,162,108,.2); border-radius: 6px;
      padding: 14px 20px; display: flex; flex-direction: column; gap: 7px;
      text-decoration: none; color: inherit; margin-bottom: 7px;
      opacity: 0; animation: fadeUp 0.3s forwards; transition: all 0.18s;
    }
    .related-card:hover { background: rgba(249,162,108,.1); border-color: rgba(249,162,108,.4); }
    .divider-label {
      font-size: 11px; color: var(--muted); padding: 8px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .divider-label::after { content:''; flex: 1; height: 1px; background: var(--border); }
    /* 탭 미확인 배지 — 이벤트 데이터가 갱신됐는데 아직 열어보지 않았을 때 */
    .tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; margin-left: 5px; padding: 0 4px;
      font-size: 10px; font-weight: 700; line-height: 1;
      color: #fff; background: #f87171; border-radius: 999px; vertical-align: middle;
    }
    /* 앱스토어 리뷰 카드 */
    .rv-stars { font-size: 13px; letter-spacing: 1px; }
    .rv-good { color: #4ade80; } .rv-mid { color: #f9a26c; } .rv-bad { color: #f87171; }
    .rv-store { font-size: 11px; color: var(--muted2); font-weight: 600; }
    .rv-foot { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .rv-reply { font-size: 12px; color: var(--muted2); line-height: 1.6; margin-top: 8px;
      padding: 9px 12px; background: var(--surface); border-radius: 6px; word-break: keep-all; }
    .rv-reply b { color: var(--text); margin-right: 5px; }

    .news-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;
      text-decoration: none; color: inherit;
      opacity: 0; transform: translateY(6px); animation: fadeUp 0.3s forwards;
      transition: all 0.18s;
    }
    @keyframes fadeUp { to{opacity:1;transform:translateY(0)} }
    .news-card:hover { background: var(--card-hover); border-color: rgba(79,158,248,.35); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,.4); }

    .card-meta { display: flex; align-items: center; gap: 8px; }
    .card-source { font-size: 11px; font-weight: 500; color: var(--muted2); }
    .card-source-blog { font-size: 11px; font-weight: 500; color: var(--muted2); }
    .card-source-cafe { font-size: 11px; font-weight: 500; color: var(--muted2); }
    .card-date { font-size: 11px; color: var(--muted); }
    .card-like { font-size: 11px; font-weight: 600; color: #f9a26c; display: inline-flex; align-items: center; gap: 3px; }

    /* 통계 타일 */
    .stat-group { margin-bottom: 12px; }
    .sg-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 6px 0 8px; }
    .sg-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .s-tile { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 13px 15px; }
    .st-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .st-value { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.15; }
    .st-delta { font-size: 11px; color: var(--muted2); margin-top: 4px; }

    /* 통계 유의사항 */
    .stat-notice { background: rgba(249,162,108,.06); border: 1px solid rgba(249,162,108,.25); border-radius: 8px; padding: 12px 15px; margin-bottom: 14px; }
    .sn-head { font-size: 11px; font-weight: 700; color: #f9a26c; letter-spacing: .3px; margin-bottom: 7px; }
    .sn-row { font-size: 12px; color: var(--muted2); line-height: 1.7; word-break: keep-all; padding: 3px 0 3px 12px; position: relative; }
    .sn-row::before { content: '·'; position: absolute; left: 2px; color: #f9a26c; font-weight: 700; }
    .sn-row b { color: var(--text); font-weight: 600; }
    .stat-notice.terms { background: var(--card); border-color: var(--border); }
    .stat-notice.terms .sn-head { color: var(--muted); }
    .stat-notice.terms .sn-row::before { color: var(--muted2); }
    .related-card .card-desc b { color: var(--text); font-weight: 600; }

    /* 연도별 추이 선그래프 */
    .trend-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
    .trend-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .trend-note { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .trend-scroll { overflow-x: auto; margin-top: 10px; }
    .trend-svg { display: block; width: 100%; min-width: 420px; height: auto; }
    .trend-svg .grid { stroke: var(--border); stroke-width: 1; }
    .trend-svg .axis { fill: var(--muted); font-size: 11px; }
    .trend-svg .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .trend-svg .ln.sub { stroke-width: 1.5; stroke-dasharray: 4 3; }
    .trend-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; }
    .tl-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted2); }
    .tl-swatch { width: 14px; height: 3px; border-radius: 2px; }

    /* 규모별 분포 막대 */
    .dist-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
    .dist-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .dist-note { font-size: 11px; color: var(--muted); margin-top: 3px; margin-bottom: 10px; }
    .dist-row { display: grid; grid-template-columns: 62px 1fr 92px; align-items: center; gap: 8px; padding: 3px 0; }
    .dist-label { font-size: 11px; color: var(--muted2); white-space: nowrap; }
    .dist-track { background: var(--border); border-radius: 3px; height: 14px; overflow: hidden; }
    .dist-fill { height: 100%; background: var(--muted2); border-radius: 3px; min-width: 2px; }
    .dist-box.hl .dist-fill { background: #f9a26c; }
    .dist-val { font-size: 11px; color: var(--text); text-align: right; white-space: nowrap; }
    .dist-val span { color: var(--muted); margin-left: 4px; }

    /* 로우 데이터 테이블 */
    .raw-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
    .raw-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .raw-note { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .raw-scroll { overflow-x: auto; margin-top: 10px; }
    .raw-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .raw-table th { text-align: left; font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em;
      padding: 7px 10px; border-bottom: 1px solid var(--border-strong, var(--border)); white-space: nowrap; }
    .raw-table td { padding: 6px 10px; color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .raw-table tr:last-child td { border-bottom: none; }
    .raw-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .raw-table tbody tr:hover td { background: var(--card-hover); }

    /* 계좌 이벤트 카드 */
    .event-note { font-size: 11px; color: var(--muted); line-height: 1.7; padding: 0 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .event-note b { color: var(--muted2); font-weight: 600; }
    .event-broker { font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 700; color: var(--text); }
    .event-badge { font-size: 10px; font-weight: 700; letter-spacing: .3px; color: #5fd08a; border: 1px solid rgba(95,208,138,.35); background: rgba(95,208,138,.08); padding: 2px 7px; border-radius: 3px; }
    .event-period { font-size: 12px; color: var(--accent); font-weight: 500; margin-left: auto; }
    .event-benefits { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-top: 2px; }
    .event-benefits li { font-size: 13px; color: var(--text); line-height: 1.6; padding-left: 14px; position: relative; word-break: keep-all; }
    .event-benefits li::before { content: '·'; position: absolute; left: 3px; color: var(--accent); font-weight: 700; }
    .event-fee { font-size: 12px; color: var(--muted2); line-height: 1.6; margin-top: 4px; }
    .event-fee b { color: var(--muted); font-weight: 500; }
    .event-link { font-size: 11px; color: var(--accent); margin-top: 6px; }
    .event-updates { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }
    .eu-head { font-size: 12px; font-weight: 700; color: var(--muted2); letter-spacing: .3px; margin-bottom: 10px; }
    .eu-row { display: flex; gap: 10px; padding: 5px 0; font-size: 12.5px; color: var(--muted2); line-height: 1.6; }
    .eu-date { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
    .eu-text { word-break: keep-all; }
    .event-title { font-size: 14px; font-weight: 600; color: var(--accent); margin: 3px 0 3px; word-break: keep-all; }
    .event-note-brokers { display: block; margin-top: 9px; font-size: 11px; color: var(--muted2); line-height: 1.9; }
    .event-note-brokers b { color: var(--muted); font-weight: 600; }
    .event-pending { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; margin-bottom: 7px; opacity: .82; transition: all .15s; }
    a.event-pending:hover { opacity: 1; border-color: rgba(79,158,248,.35); }
    .event-broker-sm { font-size: 13px; font-weight: 600; color: var(--muted2); }
    .event-pending-note { font-size: 12px; color: var(--muted); line-height: 1.6; word-break: keep-all; }
    .event-badge-s { font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 2px 7px; border-radius: 3px; }
    .badge-check { color: #f9a26c; border: 1px solid rgba(249,162,108,.35); background: rgba(249,162,108,.08); }
    .badge-none, .badge-na { color: var(--muted); border: 1px solid var(--border); }
    .card-title {
      font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 600;
      line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; transition: color 0.15s;
    }
    .card-desc { font-size: 12px; color: var(--muted2); line-height: 1.8; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* 중복 기사 묶음 (대표 1건 + 하위 제목) */
    .card-main { display: block; text-decoration: none; color: inherit; }
    .dup-badge { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(79,158,248,.3); border-radius: 3px; padding: 2px 7px; }
    .dup-toggle { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
    .dup-arrow { font-size: 10px; }
    .dup-list { display: none; }
    .dup-list.open { display: block; }
    .dup-row { display: flex; gap: 7px; padding: 5px 0; font-size: 12px; color: var(--muted2); line-height: 1.5; text-decoration: none; }
    .dup-row:first-child { padding-top: 11px; }
    .dup-row:hover .dup-t { color: var(--text); }
    .dup-src { color: var(--muted); flex: none; }
    .dup-t { word-break: keep-all; transition: color 0.15s; }
    .dup-more { font-size: 11px; color: var(--muted); padding: 6px 0 2px; }

    .init-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; gap: 16px; }
    .loading-spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-text { color: var(--muted); font-size: 13px; }
    .scroll-sentinel { height: 1px; }
    .end-msg { text-align: center; padding: 28px; color: var(--muted); font-size: 12px; display: none; }

    @media (max-width: 640px) {
      header, .filters, .stats-bar { padding-left: 20px; padding-right: 20px; }
      .news-container { padding: 16px 20px 40px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>모니터링<a class="help-link" href="/guide.html" target="_blank" rel="noopener" title="기능 정의서 보기" aria-label="기능 정의서 보기">?</a></div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="resetAndFetch()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      새로고침
    </button>
  </div>
</header>

<div class="filters">
  <span class="filter-label">조회</span>
  <label class="radio-wrap checked" id="wrap-all">
    <input type="radio" name="newsFilter" value="all" checked onchange="onModeChange('all')">
    <span>뉴스 검색</span>
  </label>
  <label class="radio-wrap" id="wrap-blog">
    <input type="radio" name="newsFilter" value="blog" onchange="onModeChange('blog')">
    <span>블로그 검색</span>
  </label>
  <label class="radio-wrap" id="wrap-event">
    <input type="radio" name="newsFilter" value="event" onchange="onModeChange('event')">
    <span>이벤트<span class="tab-badge" id="eventBadge" style="display:none"></span></span>
  </label>
  <label class="radio-wrap" id="wrap-reviews">
    <input type="radio" name="newsFilter" value="reviews" onchange="onModeChange('reviews')">
    <span>앱 리뷰<span class="tab-badge" id="reviewBadge" style="display:none"></span></span>
  </label>
  <label class="radio-wrap" id="wrap-taxnews">
    <input type="radio" name="newsFilter" value="taxnews" onchange="onModeChange('taxnews')">
    <span>세무</span>
  </label>
  <label class="radio-wrap" id="wrap-stats">
    <input type="radio" name="newsFilter" value="stats" onchange="onModeChange('stats')">
    <span>통계</span>
  </label>
</div>

<div class="blog-keywords" id="eventTabs" style="display:none">
  <span class="filter-label">분류</span>
  <span class="kw-chip active" data-mode="event" onclick="selectEventTab('event', this)">계좌 이벤트</span>
  <span class="kw-chip" data-mode="referral" onclick="selectEventTab('referral', this)">친구 초대 이벤트</span>
</div>

<div class="blog-keywords" id="taxTabs" style="display:none">
  <span class="filter-label">분류</span>
  <span class="kw-chip active" data-mode="taxnews" onclick="selectTaxTab('taxnews', this)">세법 뉴스</span>
  <span class="kw-chip" data-mode="press" onclick="selectTaxTab('press', this)">세무사회 보도자료</span>
</div>

<div class="blog-keywords" id="newsKeywords" style="display:flex">
  <span class="filter-label">키워드</span>
  <span class="kw-chip active" data-mode="all" onclick="selectNewsKeyword('all', this)">자녀 증여</span>
  <span class="kw-chip" data-mode="childfin" onclick="selectNewsKeyword('childfin', this)">자녀 금융</span>
  <span class="kw-chip" data-mode="family" onclick="selectNewsKeyword('family', this)">가족 자산 관리</span>
  <span class="kw-chip" data-mode="platform" onclick="selectNewsKeyword('platform', this)">금융 플랫폼</span>
  <span class="kw-chip" data-mode="hanwha" onclick="selectNewsKeyword('hanwha', this)">한화생명 파이</span>
</div>

<div class="blog-keywords" id="blogKeywords">
  <span class="filter-label">키워드</span>
  <span class="kw-chip active" data-kw="한화생명 파이" onclick="selectBlogKeyword('한화생명 파이', this)">한화생명 파이</span>
  <span class="kw-chip" data-kw="자녀 계좌 개설" onclick="selectBlogKeyword('자녀 계좌 개설', this)">자녀 계좌 개설</span>
  <span class="kw-chip" data-kw="자녀 증여" onclick="selectBlogKeyword('자녀 증여', this)">자녀 증여</span>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="totalCount">—</span><span class="stat-label" id="totalLabel">건의 뉴스</span></div>
  <div class="stat"><span class="stat-num" id="sourceCount">—</span><span class="stat-label" id="sourceLabel">개 매체</span></div>
  <div class="loading-badge" id="loadingBadge"><div class="mini-spinner"></div><span>로딩 중...</span></div>
</div>

<div class="news-container">
  <div id="newsGrid" class="news-grid"></div>
  <div class="scroll-sentinel" id="sentinel"></div>
  <div class="end-msg" id="endMsg">모든 기사를 불러왔습니다.</div>
  <div class="init-loader" id="initLoader"><div class="loading-spinner"></div><p class="loading-text">뉴스를 불러오는 중...</p></div>
</div>

<script>
  const PAGE_SIZE = 30;
  let allNews = [], renderedCount = 0, currentMode = 'all', bgDone = false;
  let rankCounter = 0, relatedLinks = new Set(), groups = [];
  let blogItems = [], cafeItems = [], blogLoaded = false, cafeLoaded = false;
  let eventsLoaded = false, eventsData = null;
  let pressLoaded = false, pressData = null;
  let statsLoaded = false, statsData = null;
  // 블로그 탭: 30개씩 페이지네이션 (최초 로딩 축소 + 스크롤 시 추가 로딩)
  const BLOG_PAGE = 30;
  let blogStart = 1, blogEnd = false, blogLoading = false;
  let blogKeyword = '한화생명 파이'; // 블로그 검색 키워드 (칩으로 전환)

  /* 신디케이션(동일 보도자료 복제) 근접중복 제거: 제목 문자 bigram Jaccard 유사도 */
  function titleBigrams(t) {
    const s = (t||'').replace(/<[^>]*>/g,'').replace(/[^가-힣a-z0-9]/gi,'').toLowerCase();
    const g = new Set();
    for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i+2));
    return g;
  }
  function bgJaccard(a, b) { let i = 0; a.forEach(x => { if (b.has(x)) i++; }); return i / (a.size + b.size - i || 1); }
  // 제목 맨 앞 주체(회사/기관명) 추출 — 같은 주체 기사 중복 판별용
  function leadSubject(t) {
    return (t||'').replace(/<[^>]*>/g,'').replace(/^\s*\[[^\]]*\]\s*/,'').split(/[,·…“”"'‘’]/)[0].replace(/\s+/g,'').slice(0, 12);
  }
  // 기업 오너·재벌 승계성 증여/재산 뉴스 제외 (세무사회장·협회장 등 정보성은 예외)
  const OWNER_KW = ['오너','총수','창업주','창업자','일가','블록딜','대주주','최대주주','경영권','지분','株','2세','3세','4세','오너가','가업승계','기업승계'];
  // 부동산 증여·편법증여·근저당·정치성 노이즈 제외 (예: '대통령도 쓴 근저당 매매…', 아파트/주택 증여 류)
  const NOISE_KW = ['근저당','편법증여','편법 증여','셀러 파이낸싱','셀러파이낸싱','집주인 대출','대통령','이재명',
    '부동산','아파트','주택','빌딩','상가','토지','오피스텔','건물',
  '보이스피싱','메신저피싱','스미싱'];
  function isOwnerNews(t) {
    const s = t || '';
    if (/(^|[^사협])회장/.test(s)) return true; // 회장·부회장 (세무사회장·협회장 제외)
    return OWNER_KW.some(k => s.includes(k)) || NOISE_KW.some(k => s.includes(k));
  }
  // 같은 기사 묶기: 회사명(주체) 동일 또는 본문 근접중복(0.5)이면 기존 대표에 dupe로 붙임.
  // 새 대표면 true(목록에 추가), 기존 대표에 묶이면 false.
  function assignGroup(n) {
    const subj = leadSubject(n.title);
    const sig = titleBigrams(n.title + ' ' + (n.desc || '').slice(0, 120));
    let g = null;
    if (subj.length >= 2) g = groups.find(x => x.subj === subj);
    if (!g && sig.size >= 4) g = groups.find(x => bgJaccard(sig, x.sig) >= 0.5);
    if (g) { g.rep.dupes.push(n); return false; }
    n.dupes = [];
    groups.push({ subj, sig, rep: n });
    return true;
  }

  function getKeyword() {
    if (currentMode === 'all') return '자녀 증여';
    if (currentMode === 'family') return '가족 자산 관리';
    if (currentMode === 'childfin') return '자녀 금융';
    if (currentMode === 'platform') return '금융 플랫폼';
    return '한화생명 파이 증여';
  }

  function cleanItem(item) {
    const clean = s => (s||'').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#\d+;/g,'');
    return { title: clean(item.title), desc: clean(item.description), link: item.originallink||item.link, pubDate: new Date(item.pubDate), source: extractSource(item.originallink||item.link) };
  }

  async function fetchBatch(keyword, start) {
    const res = await fetch(`/api/news?keyword=${encodeURIComponent(keyword)}&display=100&start=${start}&sort=sim`);
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    return data.items || [];
  }

  async function startLoad() {
    const keyword = getKeyword(); bgDone = false;
    try {
      const items = await fetchBatch(keyword, 1);
      const links = new Set();
      items.forEach(item => {
        const n = cleanItem(item);
        if (!links.has(n.link)) {
          if (currentMode === 'hanwha' && !n.title.includes('한화생명') && !n.desc.includes('한화생명')) return;
          if (isOwnerNews(n.title)) return;
          links.add(n.link);
          if (assignGroup(n)) { n._rank = rankCounter++; allNews.push(n); }
        }
      });
      allNews.sort((a,b) => b.pubDate - a.pubDate);
      document.getElementById('initLoader').style.display = 'none';
      renderNextPage(); updateStats(); updateTime();
      if (items.length < 100) { bgDone = true; checkEnd(); return; }
    } catch(e) {
      document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">뉴스를 불러오지 못했습니다. 새로고침해주세요.</p>';
      return;
    }
    document.getElementById('loadingBadge').classList.add('active');
    const existingLinks = new Set(allNews.map(n => n.link));
    const modeAtStart = currentMode;
    // 배경 배치(101·201)는 병렬로 받되, 관련도(_rank) 보존을 위해 순서대로 처리
    const batches = await Promise.all(
      [101, 201].map(start => fetchBatch(keyword, start).catch(() => []))
    );
    if (currentMode === modeAtStart) {
      for (const items of batches) {
        items.forEach(item => {
          const n = cleanItem(item);
          if (!existingLinks.has(n.link)) {
            if (currentMode === 'hanwha' && !n.title.includes('한화생명') && !n.desc.includes('한화생명')) return;
            if (isOwnerNews(n.title)) return;
            existingLinks.add(n.link);
            if (assignGroup(n)) { n._rank = rankCounter++; allNews.push(n); }
          }
        });
        if (items.length < 100) break;
      }
      allNews.sort((a,b) => b.pubDate - a.pubDate);
      // 연관도 섹션은 1차 배치(100건 중 필터를 통과한 40건 안팎)만 보고 이미 그려져 있다.
      // 배경 배치까지 합친 전체 기준으로 다시 뽑지 않으면 2·3차에 들어온 상위 기사가 영영 누락된다.
      // 사용자가 아직 위쪽을 보고 있을 때만 다시 그려 스크롤 위치가 튀지 않게 한다.
      if (window.scrollY < 200) {
        document.getElementById('newsGrid').innerHTML = '';
        renderedCount = 0; relatedLinks = new Set();
        renderNextPage();
      }
      updateStats();
    }
    bgDone = true;
    document.getElementById('loadingBadge').classList.remove('active');
    updateStats(); checkEnd();
  }

  // 연관도 점수 키워드. 아래 4개 묶음은 서로 겹치지 않게 유지할 것 — 같은 단어가 두 묶음에 있으면 중복 가산된다.
  const REL_HIGH = ['미성년','자녀','증여','자녀계좌','증여세','사전증여']; // 제목 +3 / 본문 +2
  // 증여를 '어떻게 하는지' 다루는 실행·절세 정보 기사. 제목 +4 / 본문 +2 로 가장 높게 본다.
  // (제목에 '자녀'가 없어도 본론이 자녀 증여 절세인 기사가 상품 보도자료에 밀리던 문제 보정)
  const REL_GUIDE = ['절세','분산 증여','나눠서 증여','증여 방법','공제한도','증여재산공제','증여 플랜','증여 전략','세대생략','물려'];
  const RELATED_KW = [ // 제목 +2 / 본문 +1
    '공제','비과세','신고','세율','상속','세무','면제','자산 이전','대물림', // 증여 정보·세무
    '손주','직계비속',                                                      // 자녀·대상
    '자산관리','가족',                                                      // 가족 자산관리
  ];
  // 계좌·이벤트 신호. 제목 +1 만 준다 — 증권사 상품 출시 보도자료가 여러 개를 동시에 먹고
  // 연관도 상위를 독식해, 정작 증여 절세 정보 기사가 밀려나는 것을 막기 위함.
  const REL_PROMO = ['계좌개설','계좌 개설','통합 메뉴','이벤트','증정','쿠폰','지급','개설','첫 계좌'];
  // 가족 자산관리 모드: 주제어(가족·자산관리)에만 가중. 증여·신탁까지 가중하면
  // 신탁 상품 기사가 상위를 독식해 '가족 자산관리' 본래 기사(세미나·설계 등)가 밀림.
  const REL_FAMILY = ['가족','자산관리','자산 관리'];

  // 자녀 금융 모드: '자녀 대상'과 '금융 수단'이 제목에서 만나는 기사를 축으로 본다.
  // 검색어가 넓어 'KB금융 소방공무원 지원' 같은 금융사 사회공헌 기사가 다수 섞이는데,
  // 자녀 신호가 없으면 점수가 거의 오르지 않아 자연히 걸러진다.
  // '아이'는 넓게 잡되 아이디어·아이폰 등 무관한 단어는 배제한다.
  const REL_KID = [/자녀/, /미성년/, /아동/, /어린이/, /손주/, /청소년/, /아이(?!디|돌|폰|패드|맥|워치|템|콘|러니)/];
  const REL_FIN = [/통장/, /계좌/, /적금/, /예금/, /펀드/, /신탁/, /보험/, /카드/, /투자/, /주식/, /ETF/, /연금/, /저축/, /증여/, /자산관리/, /자산 관리/, /용돈/, /금융교육/];
  // 파이와 같은 영역(증여·투자·계좌)은 따로 가산해 동점을 가른다. 금융교육은 인접이라 약하게.
  const REL_KID_CORE = [/증여/, /계좌/, /통장/, /투자/, /주식/, /ETF/, /적금/, /자산관리/, /자산 관리/, /저축/];
  const REL_KID_EDU  = [/금융교육/, /경제교육/, /용돈/];
  // 금융 플랫폼 모드: 검색어가 넓어 카카오 실적·AI 플랫폼 같은 비금융 기사가 다수 섞인다.
  // 그래서 '금융 서비스 플랫폼의 동향'(제목 +3 / 본문 +2)을 축으로 잡고,
  // 파이와 같은 영역(자녀·증여·자산관리)을 다루면 함께 가산되도록 했다.
  const REL_PLAT_HIGH = ['자녀','증여','미성년','자산관리','자산 관리','생애주기','연금','저축','슈퍼앱','MAU','금융앱','뱅킹'];
  const REL_PLAT = ['플랫폼','앱','핀테크','디지털','간편','비대면','이용자','가입자','출시','론칭','개편','고도화','페이','송금','결제','계좌','은행','증권','보험'];
  function relatedScore(n) {
    const t = n.title || '', d = n.desc || '';
    if (currentMode === 'family') {
      return REL_FAMILY.reduce((s, k) => s + (t.includes(k) ? 3 : 0) + (d.includes(k) ? 1 : 0), 0);
    }
    if (currentMode === 'childfin') {
      // 각 묶음은 '개념당 1회'만 센다. 키워드마다 더하면 동의어를 나열한 제목이 점수를 배로 얻는다.
      let s = 0;
      const kidT = REL_KID.some(r => r.test(t)), finT = REL_FIN.some(r => r.test(t));
      if (kidT) s += 5;
      if (REL_KID.some(r => r.test(d))) s += 2;
      if (finT) s += 3;
      if (REL_FIN.some(r => r.test(d))) s += 1;
      if (kidT && finT) s += 4;                                    // 자녀 × 금융이 제목에서 만나는 기사
      if (kidT && REL_KID_CORE.some(r => r.test(t))) s += 3;       // 증여·투자·계좌 = 파이 핵심
      if (kidT && REL_KID_EDU.some(r => r.test(t))) s += 1;
      return s;
    }
    if (currentMode === 'platform') {
      return REL_PLAT_HIGH.reduce((s, k) => s + (t.includes(k) ? 3 : 0) + (d.includes(k) ? 2 : 0), 0)
           + REL_PLAT.reduce((s, k) => s + (t.includes(k) ? 2 : 0) + (d.includes(k) ? 1 : 0), 0);
    }
    return REL_HIGH.reduce((s, k) => s + (t.includes(k) ? 3 : 0) + (d.includes(k) ? 2 : 0), 0)
         + REL_GUIDE.reduce((s, k) => s + (t.includes(k) ? 4 : 0) + (d.includes(k) ? 2 : 0), 0)
         + RELATED_KW.reduce((s, k) => s + (t.includes(k) ? 2 : 0) + (d.includes(k) ? 1 : 0), 0)
         + REL_PROMO.reduce((s, k) => s + (t.includes(k) ? 1 : 0), 0);
  }

  function renderRelated(grid, items, kw) {
    // 연관도 점수 내림차순(동점이면 sim 순서), 단 같은 사건 중복 배제하고 상위 4건
    const scored = [...items]
      .map(n => ({ n, s: relatedScore(n) }))
      .sort((a, b) => b.s - a.s || (a.n._rank ?? 1e9) - (b.n._rank ?? 1e9));
    const candidates = [], pT = [], pTD = [], pSubj = [];
    for (const c of scored) {
      if (candidates.length >= 4) break;
      const gt = titleBigrams(c.n.title);
      const gtd = titleBigrams(c.n.title + ' ' + (c.n.desc || '').slice(0, 120));
      const subj = leadSubject(c.n.title);
      // 같은 사건/주체 배제: 제목 유사 or 제목+본문 유사 or 동일 주체(회사명) → 서로 다른 4건 확보
      const dup = pT.some((s, k) =>
        bgJaccard(gt, s) >= 0.2 || bgJaccard(gtd, pTD[k]) >= 0.3 || (subj.length >= 2 && subj === pSubj[k]));
      if (dup) continue;
      pT.push(gt); pTD.push(gtd); pSubj.push(subj); candidates.push(c);
    }
    if (!candidates.length) return;
    candidates.forEach(({n}) => relatedLinks.add(n.link));

    const sec = document.createElement('div');
    sec.className = 'related-section';
    const relLabel = currentMode === 'family' ? '가족 자산 관리 관련 기사'
                   : currentMode === 'childfin' ? '자녀 금융 관련 기사'
                   : currentMode === 'platform' ? '금융 플랫폼 관련 기사'
                   : currentMode === 'hanwha' ? '한화생명 파이 관련 기사'
                   : '자녀 증여 관련 기사';
    sec.innerHTML = `<div class="related-header"><span class="related-badge">연관도 높음</span><span class="related-label">${relLabel}</span></div>`;

    candidates.forEach(({n}, i) => {
      const el = document.createElement('a');
      el.className = 'related-card'; el.href = n.link; el.target = '_blank'; el.rel = 'noopener';
      el.style.animationDelay = `${i*0.08}s`;
      el.innerHTML = `
        <div class="card-meta">
          <span class="card-source">[${esc(n.source)}]</span>
          <span class="card-date">${formatDate(n.pubDate)}</span>
        </div>
        <div class="card-title">${highlightKeyword(esc(n.title), kw)}</div>
        ${n.desc ? `<div class="card-desc">${esc(n.desc.slice(0,200))}</div>` : ''}`;
      sec.appendChild(el);
    });
    grid.appendChild(sec);

    const divider = document.createElement('div');
    divider.className = 'divider-label';
    divider.textContent = '최신 기사';
    grid.appendChild(divider);
  }

  function renderNextPage() {
    if (currentMode === 'blog' || currentMode === 'cafe' || currentMode === 'event' || currentMode === 'referral' || currentMode === 'reviews' || currentMode === 'taxnews' || currentMode === 'press' || currentMode === 'stats') return;
    if (renderedCount >= allNews.length) { checkEnd(); return; }
    const grid = document.getElementById('newsGrid');
    const kw = currentMode === 'all' ? ['자녀','증여']
             : currentMode === 'family' ? ['가족','자산관리']
             : currentMode === 'childfin' ? ['자녀','금융']
             : currentMode === 'platform' ? ['금융','플랫폼']
             : '파이';

    // 첫 렌더시에만 연관 기사 섹션 삽입
    if (renderedCount === 0 && (currentMode === 'all' || currentMode === 'family' || currentMode === 'childfin' || currentMode === 'platform')) {
      renderRelated(grid, allNews, kw);
    }

    let added = 0;
    while (renderedCount < allNews.length && added < PAGE_SIZE) {
      const n = allNews[renderedCount++];
      if (relatedLinks.has(n.link)) continue; // 연관도 섹션에 이미 노출된 기사는 제외
      const dupes = n.dupes || [];
      const el = document.createElement('div');
      el.className = 'news-card';
      el.style.animationDelay = `${Math.min(added*0.04,0.5)}s`;
      let dupHtml = '';
      if (dupes.length) {
        const shown = dupes.slice(0, 15);
        const rows = shown.map(d => `<a class="dup-row" href="${esc(d.link)}" target="_blank" rel="noopener"><span class="dup-src">[${esc(d.source)}]</span><span class="dup-t">${esc(d.title)}</span></a>`).join('');
        const more = dupes.length > shown.length ? `<div class="dup-more">…외 ${dupes.length - shown.length}건</div>` : '';
        dupHtml = `<div class="dup-toggle" data-total="${dupes.length}" onclick="toggleDupes(this, event)"><span class="dup-arrow">▾</span><span class="dup-label">같은 내용 기사 ${dupes.length}건 더보기</span></div><div class="dup-list">${rows}${more}</div>`;
      }
      el.innerHTML = `
        <a class="card-main" href="${esc(n.link)}" target="_blank" rel="noopener">
          <div class="card-meta">
            <span class="card-source">[${esc(n.source)}]</span>
            <span class="card-date">${formatDate(n.pubDate)}</span>
            ${dupes.length ? `<span class="dup-badge">관련 ${dupes.length + 1}건</span>` : ''}
          </div>
          <div class="card-title">${highlightKeyword(esc(n.title), kw)}</div>
          ${n.desc ? `<div class="card-desc">${esc(n.desc.slice(0,200))}</div>` : ''}
        </a>${dupHtml}`;
      grid.appendChild(el);
      added++;
    }
    checkEnd();
  }

  function checkEnd() {
    document.getElementById('endMsg').style.display = (bgDone && renderedCount >= allNews.length) ? 'block' : 'none';
  }

  function toggleDupes(el, e) {
    e.preventDefault(); e.stopPropagation();
    const list = el.nextElementSibling;
    const open = list.classList.toggle('open');
    el.querySelector('.dup-arrow').textContent = open ? '▴' : '▾';
    el.querySelector('.dup-label').textContent = open ? '접기' : `같은 내용 기사 ${el.dataset.total}건 더보기`;
  }

  const observer = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    if (currentMode === 'blog') { if (!blogEnd && !blogLoading) loadBlogPage(); return; }
    if (currentMode==='cafe' || currentMode==='event' || currentMode==='referral' || currentMode==='reviews' || currentMode==='taxnews' || currentMode==='press' || currentMode==='stats') return;
    if (renderedCount < allNews.length) renderNextPage();
  }, { rootMargin: '400px' });
  observer.observe(document.getElementById('sentinel'));

  // ── 주소로 탭 지정 ──────────────────────────────────────────
  // #reviews 처럼 mode 이름을 해시에 담아, 특정 탭을 연 상태의 주소를 공유할 수 있게 한다.
  // 뉴스 키워드(#childfin)와 이벤트 서브탭(#referral)도 같은 방식으로 지정된다.
  const NEWS_MODES = ['all','family','childfin','platform','hanwha'];
  const TAB_MODES  = ['blog','event','reviews','taxnews','stats'];

  function setHash(mode) {
    // 기본 화면(자녀 증여)은 해시 없이 둔다
    const want = (mode === 'all') ? '' : '#' + mode;
    const cur = location.hash || '';
    if (cur === want) return;
    history.replaceState(null, '', want || (location.pathname + location.search));
  }

  // 주소에 지정된 탭이 있으면 그대로 열고 true를 돌려준다. 없으면 false (기본 화면 진행).
  function routeFromHash() {
    const m = (location.hash || '').replace(/^#\/?/, '');
    if (!m) return false;

    if (NEWS_MODES.includes(m)) {
      if (m === 'all') return false;                       // 기본 화면과 같다
      document.querySelector('input[value="all"]').checked = true;
      currentMode = m;                                     // onModeChange를 거치면 검색이 두 번 돈다
      document.querySelectorAll('#newsKeywords .kw-chip').forEach(c => c.classList.toggle('active', c.dataset.mode === m));
      resetNews(); startLoad();
      return true;
    }
    if (m === 'press') {                                   // 세법 탭의 서브탭
      document.querySelector('input[value="taxnews"]').checked = true;
      onModeChange('taxnews');
      const chip = document.querySelector('#taxTabs .kw-chip[data-mode="press"]');
      if (chip) selectTaxTab('press', chip);
      return true;
    }
    if (m === 'referral') {                                // 이벤트 탭의 서브탭
      document.querySelector('input[value="event"]').checked = true;
      onModeChange('event');
      const chip = document.querySelector('#eventTabs .kw-chip[data-mode="referral"]');
      if (chip) selectEventTab('referral', chip);
      return true;
    }
    if (TAB_MODES.includes(m)) {
      const input = document.querySelector('input[value="' + m + '"]');
      if (!input) return false;
      input.checked = true;
      onModeChange(m);
      return true;
    }
    return false;
  }

  // 이미 열려 있는 화면에서 주소만 바뀌는 경우(주소창 수정, 뒤로가기)도 따라간다.
  // setHash는 replaceState라 hashchange를 발생시키지 않으므로 되돌이 호출은 없다.
  window.addEventListener('hashchange', function () {
    if (routeFromHash()) return;
    const input = document.querySelector('input[value="all"]');
    if (input && !input.checked) { input.checked = true; onModeChange('all'); }
  });

  function onModeChange(mode) {
    currentMode = mode;
    setHash(mode);
    document.querySelectorAll('.radio-wrap').forEach(w => w.classList.remove('checked'));
    document.getElementById('wrap-' + mode).classList.add('checked');
    document.querySelector('.stats-bar').style.display = (mode === 'event' || mode === 'blog' || mode === 'press' || mode === 'stats' || mode === 'reviews' || mode === 'taxnews') ? 'none' : 'flex';
    document.getElementById('blogKeywords').style.display = (mode === 'blog') ? 'flex' : 'none';
    document.getElementById('newsKeywords').style.display = (mode === 'all') ? 'flex' : 'none';
    document.getElementById('eventTabs').style.display = (mode === 'event') ? 'flex' : 'none';
    document.getElementById('taxTabs').style.display = (mode === 'taxnews') ? 'flex' : 'none';
    if (mode === 'blog') { blogItems = []; blogStart = 1; blogEnd = false; blogPrefetch = null; showBlog(); }
    else if (mode === 'cafe') { cafeLoaded = false; cafeItems = []; showCafe(); }
    else if (mode === 'event') { // 이벤트 탭 — 서브탭을 '계좌 이벤트'로 초기화
      document.querySelectorAll('#eventTabs .kw-chip').forEach(c => c.classList.toggle('active', c.dataset.mode === 'event'));
      showEvents().then(markEventChangesSeen).catch(() => {});
    }
    else if (mode === 'reviews') { showReviews().then(markReviewsSeen).catch(() => {}); }
    else if (mode === 'taxnews') { // 세법 탭 — 서브탭을 '세법 뉴스'로 초기화
      document.querySelectorAll('#taxTabs .kw-chip').forEach(c => c.classList.toggle('active', c.dataset.mode === 'taxnews'));
      showTaxNews();
    }
    else if (mode === 'press') { showPress(); }
    else if (mode === 'stats') { showStats(); }
    else { // 뉴스 검색 탭 — 키워드 칩을 '자녀 증여'로 초기화
      document.querySelectorAll('#newsKeywords .kw-chip').forEach(c => c.classList.toggle('active', c.dataset.mode === 'all'));
      resetNews(); startLoad();
    }
  }

  function cleanHtml(s) { return (s||'').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#\d+;/g,'').replace(/&apos;/g,"'"); }

  async function showBlog() {
    resetGrid('블로그 글을 불러오는 중...');
    const ok = await loadBlogPage();
    if (currentMode !== 'blog') return;            // 로딩 중 다른 탭으로 전환됨
    if (!ok) return;                               // 에러 메시지는 loadBlogPage가 표시
    document.getElementById('initLoader').style.display = 'none';
    setBlogPlaceholder();
    updateBlogStats();
  }

  // 결과가 0건일 때만 안내를 띄운다. 아직 더 받을 페이지가 남았으면
  // '없음'이라고 단정하지 말 것 — 한화생명 파이처럼 걸러내는 키워드는
  // 앞쪽 페이지가 통째로 걸러져 뒤늦게 첫 글이 나온다.
  function setBlogPlaceholder() {
    const loader = document.getElementById('initLoader');
    if (loader && loader.style.display !== 'none') return;   // 첫 로딩 스피너와 겹치지 않게
    const grid = document.getElementById('newsGrid');
    const ph = grid.querySelector('.blog-placeholder');
    if (blogItems.length) { if (ph) ph.remove(); return; }
    const msg = blogEnd
      ? '검색 결과가 없습니다.'
      : '관련 글을 계속 찾는 중입니다…';
    if (ph) { ph.textContent = msg; return; }
    const p = document.createElement('p');
    p.className = 'blog-placeholder';
    p.style.cssText = 'color:var(--muted);text-align:center;padding:40px';
    p.textContent = msg;
    grid.appendChild(p);
  }

  // '한화생명 파이'는 네이버 블로그 검색이 '한화생명'과 '파이'를 따로 찾아
  // 주식 시황·와이파이 글처럼 두 단어가 우연히 든 글이 대량으로 섞여 들어온다.
  //   ① 정렬을 date로 바꾼다. sim은 7,358건이 잡히는데 상위 150건에 관련 글이 0건인
  //      반면, date는 44건만 잡히고 그중 27건이 관련 글이다 (실측 2026-08-28).
  //      ※ 다른 키워드는 sim이 더 낫다. 이 칩에만 date를 쓴다.
  //   ② 받아온 뒤 아래 정규식으로 한 번 더 거른다.
  //      '한화생명 … 파이'(사이에 쉼표 등 한글 아닌 문자 6자까지 허용),
  //      '파이(Pi)', '파이 앱', 따옴표로 묶인 '파이' 를 통과시킨다.
  //      한글이 끼면 막으므로 '한화생명볼파크'는 걸러진다.
  //      ②가 없으면 '파이낸셜타임스'·'와이파이'·'스틱파이' 같은 글이 통과한다.
  // 검색어에 '증여'를 더하지 말 것 — 모집단이 44건→22건으로 줄어 관련 글을 잃는다.
  const BLOG_PI_CHIP = '한화생명 파이';
  const BLOG_PI_RE = /한화생명[^가-힣]{0,6}파이|파이\s*\(\s*[Pp]i\s*\)|파이\s*앱|파이앱|['"“”‘’]파이['"“”‘’]/;
  const blogQuery = () => blogKeyword;
  const blogSort = () => (blogKeyword === BLOG_PI_CHIP ? 'date' : 'sim');
  function blogRelevant(b) {
    if (blogKeyword !== BLOG_PI_CHIP) return true;   // 다른 키워드는 결과가 깨끗해 거르지 않는다
    return BLOG_PI_RE.test(`${b.title} ${b.desc}`);
  }

  // 다음 30개 블로그 글을 start 파라미터로 이어서 불러와 그리드에 추가
  // 다음 페이지를 미리 받아두는 버퍼 (스크롤 시 대기 없이 즉시 렌더)
  let blogPrefetch = null, blogPrefetchStart = 0;
  function blogUrl(start) {
    return `/api/blog?keyword=${encodeURIComponent(blogQuery())}&display=${BLOG_PAGE}&start=${start}&sort=${blogSort()}`;
  }
  function prefetchBlogPage(start) {
    if (blogEnd || start > 1000) return;
    blogPrefetchStart = start;
    blogPrefetch = fetch(blogUrl(start)).then(r => r.ok ? r.json() : null).catch(() => null);
  }

  async function loadBlogPage(depth = 0) {
    if (blogEnd || blogLoading) return false;
    blogLoading = true;
    try {
      // 미리 받아둔 응답이 있으면 그대로 사용, 없으면 지금 요청
      const pending = (blogPrefetch && blogPrefetchStart === blogStart) ? blogPrefetch : null;
      blogPrefetch = null;
      const data = pending ? await pending : await (async () => {
        const r = await fetch(blogUrl(blogStart));
        if (!r.ok) throw new Error(`API ${r.status}`);
        return r.json();
      })();
      if (!data) throw new Error('blog fetch failed');
      const fetched = (data.items||[]).map(item => ({ title: cleanHtml(item.title), desc: cleanHtml(item.description), link: item.link, source: item.bloggername||'블로그', postdate: item.postdate||'', likeId: naverBlogId(item.link), likes: null }));
      const seen = new Set(blogItems.map(b => b.link));
      const fresh = [];
      fetched.filter(blogRelevant).forEach(b => { if (b.link && !seen.has(b.link)) { seen.add(b.link); fresh.push(b); blogItems.push(b); } });
      blogStart += BLOG_PAGE;
      // 페이지 소진 판단은 '거르기 전' 수신 건수로 한다 (걸러진 수로 보면 조기 종료된다)
      if (fetched.length < BLOG_PAGE || blogStart > 1000) blogEnd = true;
      if (currentMode === 'blog') { appendBlogItems(fresh); loadBlogLikes(fresh); }
      blogLoading = false;
      updateBlogStats();
      if (currentMode === 'blog') setBlogPlaceholder();
      if (!blogEnd) prefetchBlogPage(blogStart); // 다음 페이지 미리 받아두기
      // 필터를 거치면 한 페이지에서 남는 글이 적어 화면이 스크롤되지 않을 수 있다.
      // 그러면 무한스크롤 관찰자가 다시 깨어나지 못해 목록이 거기서 멈춘다.
      // 스크롤이 생기거나 더 받을 게 없을 때까지 이어서 받는다 (한 호출에 최대 8페이지).
      const maxDepth = (blogKeyword === BLOG_PI_CHIP) ? 14 : 8;   // 거르는 키워드는 더 깊이
      if (!blogEnd && currentMode === 'blog' && depth < maxDepth) {
        const thin = blogItems.length < BLOG_PAGE;   // 한 페이지 분량도 못 채웠다
        const notScrollable = document.documentElement.scrollHeight <= window.innerHeight + 500;
        if (!fresh.length || thin || notScrollable) return loadBlogPage(depth + 1);
      }
      return true;
    } catch(e) {
      blogLoading = false;
      if (!blogItems.length) document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">블로그를 불러오지 못했습니다.</p>';
      return false;
    }
  }

  function appendBlogItems(items) {
    if (!items.length) return;
    const grid = document.getElementById('newsGrid');
    // 먼저 떠 있던 '검색 결과가 없습니다' 안내를 지운다.
    // (이게 없으면 뒤늦게 도착한 글이 안내문 아래에 붙어 둘 다 보인다)
    const ph = grid.querySelector('.blog-placeholder');
    if (ph) ph.remove();
    items.forEach((item, i) => {
      const el = document.createElement('a');
      el.className = 'news-card'; el.href = item.link; el.target = '_blank'; el.rel = 'noopener';
      el.style.animationDelay = `${Math.min(i*0.03,0.5)}s`;
      let dateStr = item.postdate && item.postdate.length===8 ? `${item.postdate.slice(4,6)}/${item.postdate.slice(6,8)}` : '';
      el.innerHTML = `
        <div class="card-meta">
          ${item.source ? `<span class="card-source-blog">[${esc(item.source)}]</span>` : ''}
          ${dateStr ? `<span class="card-date">${dateStr}</span>` : ''}
          ${item.likeId ? `<span class="card-like" data-lk="${esc(item.likeId)}">♥ …</span>` : ''}
        </div>
        <div class="card-title">${esc(item.title)}</div>
        ${item.desc ? `<div class="card-desc">${esc(item.desc.slice(0,200))}</div>` : ''}`;
      grid.appendChild(el);
    });
  }

  // 이벤트 탭의 서브탭 (계좌 이벤트 / 친구 초대 이벤트). 상단 탭은 'event' 하나로 유지되고
  // currentMode만 바뀌므로 wrap-* 체크 상태는 건드리지 않는다.
  function selectEventTab(mode, el) {
    if (mode === currentMode) return;
    document.querySelectorAll('#eventTabs .kw-chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    currentMode = mode;
    setHash(mode);
    if (mode === 'referral') showReferral(); else showEvents();
  }

  // 세법 탭의 서브탭 (세법 뉴스 / 세무사회 보도자료)
  function selectTaxTab(mode, el) {
    if (mode === currentMode) return;
    document.querySelectorAll('#taxTabs .kw-chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    currentMode = mode;
    setHash(mode);
    if (mode === 'press') showPress(); else showTaxNews();
  }

  function selectNewsKeyword(mode, el) {
    if (mode === currentMode && allNews.length) return;
    document.querySelectorAll('#newsKeywords .kw-chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    currentMode = mode; // 'all'=자녀 증여, 'hanwha'=한화생명 파이
    setHash(mode);
    resetNews(); startLoad();
  }

  function selectBlogKeyword(kw, el) {
    if (kw === blogKeyword && blogItems.length) return;
    blogKeyword = kw;
    document.querySelectorAll('#blogKeywords .kw-chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    blogItems = []; blogStart = 1; blogEnd = false; blogLoading = false; blogPrefetch = null;
    showBlog();
  }

  function updateBlogStats() {
    document.getElementById('totalCount').textContent = blogItems.length;
    document.getElementById('totalLabel').textContent = '건의 블로그';
    document.getElementById('sourceCount').textContent = new Set(blogItems.map(n=>n.source)).size;
    document.getElementById('sourceLabel').textContent = '개 블로그';
    document.getElementById('endMsg').style.display = (blogEnd && blogItems.length > 0) ? 'block' : 'none';
  }

  /* 네이버 블로그 링크에서 공감 조회용 ID(blogId_logNo) 추출 */
  function naverBlogId(link) {
    try {
      const u = new URL(link);
      if (!u.hostname.includes('blog.naver.com')) return null;
      const m = u.pathname.match(/^\/([^/]+)\/(\d+)/);
      if (m) return `${m[1]}_${m[2]}`;
      const bid = u.searchParams.get('blogId'), log = u.searchParams.get('logNo');
      if (bid && log) return `${bid}_${log}`;
    } catch {}
    return null;
  }

  /* 공감수 일괄 조회 후 카드에 채움 (해당 페이지 항목만, 다른 페이지 값은 유지) */
  async function loadBlogLikes(items) {
    const src = items || blogItems;
    const ids = [...new Set(src.map(b => b.likeId).filter(Boolean))].slice(0, 60);
    if (!ids.length) return;
    let map = {};
    try {
      const r = await fetch(`/api/likes?ids=${encodeURIComponent(ids.join(','))}`);
      map = await r.json();
    } catch { return; }
    const idSet = new Set(ids);
    blogItems.forEach(b => { if (b.likeId && map[b.likeId] != null) b.likes = map[b.likeId]; });
    document.querySelectorAll('.card-like[data-lk]').forEach(el => {
      const key = el.getAttribute('data-lk');
      if (!idSet.has(key)) return;          // 이번 페이지 카드가 아니면 건드리지 않음
      const c = map[key];
      el.textContent = (c != null) ? `♥ ${c}` : '';
    });
  }

  async function showCafe() {
    resetGrid('카페 글을 불러오는 중...');
    if (!cafeLoaded) {
      try {
        const res = await fetch(`/api/cafe?keyword=${encodeURIComponent('한화생명 파이')}&display=100&sort=sim`);
        cafeItems = ((await res.json()).items||[]).map(item => ({ title: cleanHtml(item.title), desc: cleanHtml(item.description), link: item.link, source: item.cafename||'카페', postdate: '' }));
        cafeLoaded = true;
      } catch(e) { document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">카페를 불러오지 못했습니다.</p>'; return; }
    }
    document.getElementById('initLoader').style.display = 'none';
    renderSecondaryItems(cafeItems, 'cafe');
    document.getElementById('totalCount').textContent = cafeItems.length;
    document.getElementById('totalLabel').textContent = '건의 카페글';
    document.getElementById('sourceCount').textContent = new Set(cafeItems.map(n=>n.source)).size;
    document.getElementById('sourceLabel').textContent = '개 카페';
    document.getElementById('endMsg').style.display = cafeItems.length > 0 ? 'block' : 'none';
  }

  async function showEvents() {
    resetGrid('이벤트 정보를 불러오는 중...');
    document.getElementById('loadingBadge').classList.remove('active');
    if (!eventsLoaded) {
      try {
        const res = await fetch('/api/events');
        eventsData = await res.json();
        eventsLoaded = true;

  // ── 이벤트 탭 미확인 배지 ────────────────────────────────────
  // 이벤트 데이터가 갱신됐는데 아직 열어보지 않았으면 탭에 숫자를 띄운다.
  // 확인 여부는 localStorage에 두므로 기기(브라우저)별로 따로 관리된다 — 서버에 남지 않는다.
  const SEEN_KEY = 'giftTax.eventChangesSeen';
  const REVIEW_SEEN_KEY = 'giftTax.reviewsSeen';
  function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }   // 시크릿 모드 등에서 막힐 수 있다
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
  function setBadge(id, n) {
    const el = document.getElementById(id);
    el.textContent = n;
    el.style.display = n > 0 ? 'inline-flex' : 'none';
  }

  // 갱신 '날짜' 단위로 센다. 같은 날 여러 건이 바뀌어도 한 번의 갱신으로 본다.
  function unseenChangeCount(changes) {
    const dates = [...new Set((changes || []).map(c => c.date))].sort().reverse();
    if (!dates.length) return 0;
    const seen = lsGet(SEEN_KEY);
    if (!seen) return 1;                       // 처음 방문: 가장 최근 갱신 1건만 알린다
    return dates.filter(d => d > seen).length;
  }

  function renderEventBadge() { setBadge('eventBadge', unseenChangeCount((eventsData || {}).changes)); }

  // 리뷰는 같은 날 여러 건이 올라올 수 있어 날짜로는 못 가른다.
  // 마지막으로 본 '리뷰 자체'를 기억해 두고, 그보다 앞에 몇 건이 쌓였는지로 센다.
  function reviewKey(r) { return [r.date, r.store, r.author, (r.text || '').slice(0, 20)].join('|'); }
  function unseenReviewCount(reviews) {
    const list = reviews || [];                // 최신순 정렬 상태로 들어온다
    if (!list.length) return 0;
    const seen = lsGet(REVIEW_SEEN_KEY);
    if (!seen) return 1;                       // 처음 방문: 최신 1건만 알린다
    const idx = list.findIndex(r => reviewKey(r) === seen);
    return idx < 0 ? 1 : idx;                  // 그 리뷰가 사라졌으면 '뭔가 바뀜'으로만 알린다
  }

  function renderReviewBadge() { setBadge('reviewBadge', unseenReviewCount((reviewsData || {}).reviews)); }

  function markReviewsSeen() {
    const list = (reviewsData || {}).reviews || [];
    if (list.length) lsSet(REVIEW_SEEN_KEY, reviewKey(list[0]));

    (rel.length ? rest : items).forEach(i => card(i, 'news-card'));
  }

  // 통계 — 증여·상속세 주요 지표(큐레이션) + 공식 통계 바로가기
  async function showStats() {
    resetGrid('통계를 불러오는 중...');
    document.querySelector('.stats-bar').style.display = 'none';
    if (!statsLoaded) {
      try {
        const res = await fetch('/api/stats');
        statsData = await res.json();
        statsLoaded = true;
      } catch(e) { document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">통계를 불러오지 못했습니다.</p>'; return; }
    }
    if (currentMode !== 'stats') return;
    document.getElementById('initLoader').style.display = 'none';
    document.getElementById('endMsg').style.display = 'none';
    const d = statsData || {};
    const grid = document.getElementById('newsGrid'); grid.innerHTML = '';

    const note = document.createElement('div');
    note.className = 'event-note';
    note.innerHTML = `<b>증여 통계</b> · ${esc(d.basis||'')} · 출처 ${esc(d.source||'')}`;
    grid.appendChild(note);

    // 통계 해석 유의사항
    if ((d.notice || []).length) {
      const nb = document.createElement('div');
      nb.className = 'stat-notice';
      nb.innerHTML = `<div class="sn-head">읽기 전 확인</div>` +
        d.notice.map(t => `<div class="sn-row">${t}</div>`).join('');
      grid.appendChild(nb);
    }

    const age = d.age;
    if (age && (age.items||[]).length) {
      const sec = document.createElement('div');
      sec.className = 'related-section';
      sec.innerHTML = `<div class="related-header"><span class="related-label">${esc(age.title||'주요 지표')}</span></div>`;
      grid.appendChild(sec);
      age.items.forEach(a => {
        const el = document.createElement('div');
        el.className = 'related-card';
        el.innerHTML = `<div class="card-meta"><span class="event-broker">${esc(a.group)}</span>${a.tag ? `<span class="dup-badge">${esc(a.tag)}</span>` : ''}</div>` +
          // lines는 서버 상수(api/stats.js)라 <b> 등 간단한 서식을 그대로 허용한다 (notice와 동일)
          (a.lines||[]).map(l => `<div class="card-desc" style="-webkit-line-clamp:unset">${l}</div>`).join('');
        grid.appendChild(el);
      });
    }

    // 연도별 추이 선그래프 (2021=100 지수)
    if (d.trend && (d.trend.series || []).length) {
      const t = d.trend;
      const dv = document.createElement('div');
      dv.className = 'divider-label'; dv.textContent = '연도별 추이';
      grid.appendChild(dv);

      const PAL = ['#f9a26c', '#6ea8fe', '#7ddba1', '#c9a3f0', '#9aa3b5', '#c8ccd6'];
      const W = 640, H = 300, ML = 40, MR = 12, MT = 14, MB = 30;
      const xs = i => ML + (W - ML - MR) * (i / Math.max(1, t.years.length - 1));
      const all = t.series.flatMap(s => s.index);
      const lo = Math.max(0, Math.floor(Math.min(...all) / 10) * 10 - 10);
      const hi = Math.ceil(Math.max(...all) / 10) * 10 + 5;
      const ys = v => MT + (H - MT - MB) * (1 - (v - lo) / (hi - lo));

      let g = '';
      for (let v = lo; v <= hi; v += 20) {
        g += `<line class="grid" x1="${ML}" y1="${ys(v).toFixed(1)}" x2="${W - MR}" y2="${ys(v).toFixed(1)}"/>` +
             `<text class="axis" x="${ML - 6}" y="${(ys(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
      }
      t.years.forEach((y, i) => {
        g += `<text class="axis" x="${xs(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(y)}</text>`;
      });
      t.series.forEach((s, si) => {
        const c = PAL[si % PAL.length];
        const pts = s.index.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
        g += `<polyline class="ln${s.sub ? ' sub' : ''}" points="${pts}" stroke="${c}"/>`;
        s.index.forEach((v, i) => {
          g += `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="${s.hl ? 3.5 : 2.5}" fill="${c}"><title>${esc(s.name)} ${esc(t.years[i])}년 · ${esc(s.values[i])}명 · 지수 ${esc(v)}</title></circle>`;
        });
      });

      const box = document.createElement('div');
      box.className = 'trend-box';
      box.innerHTML = `<div class="trend-title">${esc(t.title)}</div>` +
        (t.note ? `<div class="trend-note">${esc(t.note)}</div>` : '') +
        `<div class="trend-scroll"><svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.title)}">${g}</svg></div>` +
        `<div class="trend-legend">` + t.series.map((s, si) =>
          `<span class="tl-item"><span class="tl-swatch" style="background:${PAL[si % PAL.length]}"></span>${esc(s.name)}</span>`).join('') +
        `</div>`;
      grid.appendChild(box);
    }

    // 규모별 분포 막대
    if ((d.dist || []).length) {
      const dv = document.createElement('div');
      dv.className = 'divider-label'; dv.textContent = '규모별 분포';
      grid.appendChild(dv);
      d.dist.forEach(t => {
        const max = Math.max(...(t.rows || []).map(r => Number(r.pct) || 0), 1);
        const box = document.createElement('div');
        box.className = 'dist-box' + (t.hl ? ' hl' : '');
        box.innerHTML = `<div class="dist-title">${esc(t.title)}</div>` +
          (t.note ? `<div class="dist-note">${esc(t.note)}</div>` : '') +
          (t.rows || []).map(r => `<div class="dist-row">` +
            `<div class="dist-label">${esc(r.label)}</div>` +
            `<div class="dist-track"><div class="dist-fill" style="width:${(Number(r.pct) / max * 100).toFixed(1)}%"></div></div>` +
            `<div class="dist-val">${esc(r.value)}<span>${esc(r.pct)}%</span></div>` +
          `</div>`).join('');
        grid.appendChild(box);
      });
    }

    if ((d.metrics || []).length) {
      const dv3 = document.createElement('div');
      dv3.className = 'divider-label'; dv3.textContent = '요약 지표';
      grid.appendChild(dv3);
    }
    (d.metrics || []).forEach(g => {
      const box = document.createElement('div');
      box.className = 'stat-group';
      box.innerHTML = `<div class="sg-title">${esc(g.group)}</div><div class="sg-tiles">` +
        g.items.map(it => `<div class="s-tile"><div class="st-label">${esc(it.label)}</div><div class="st-value">${esc(it.value)}</div><div class="st-delta">${esc(it.delta)}</div></div>`).join('') +
        `</div>`;
      grid.appendChild(box);
    });

    // 용어 풀이 — 아래 로우 데이터 표의 컬럼 이름을 설명한다
    if (d.terms && (d.terms.items || []).length) {
      const tb = document.createElement('div');
      tb.className = 'stat-notice terms';
      tb.innerHTML = `<div class="sn-head">${esc(d.terms.title || '용어 풀이')}</div>` +
        d.terms.items.map(t => `<div class="sn-row">${t}</div>`).join('');
      grid.appendChild(tb);
    }

    // 로우 데이터 테이블
    if ((d.raw || []).length) {
      const dv = document.createElement('div');
      dv.className = 'divider-label'; dv.textContent = '로우 데이터';
      grid.appendChild(dv);
      d.raw.forEach(t => {
        const box = document.createElement('div');
        box.className = 'raw-box';
        box.innerHTML = `<div class="raw-title">${esc(t.title)}</div>` +
          (t.note ? `<div class="raw-note">${esc(t.note)}</div>` : '') +
          `<div class="raw-scroll"><table class="raw-table"><thead><tr>` +
          (t.columns||[]).map((c,i) => `<th${i ? ' class="num"' : ''}>${esc(c)}</th>`).join('') +
          `</tr></thead><tbody>` +
          (t.rows||[]).map(r => `<tr>` + r.map((c,i) => `<td${i ? ' class="num"' : ''}>${esc(String(c))}</td>`).join('') + `</tr>`).join('') +
          `</tbody></table></div>`;
        grid.appendChild(box);
      });
    }

    if ((d.sources || []).length) {
      const divider = document.createElement('div');
      divider.className = 'divider-label'; divider.textContent = '공식 통계 바로가기';
      grid.appendChild(divider);
      d.sources.forEach(s => {
        const el = document.createElement('a');
        el.className = 'news-card'; el.href = s.link; el.target = '_blank'; el.rel = 'noopener';
        el.innerHTML = `<div class="card-title">${esc(s.title)}</div><div class="card-desc">${esc(s.desc)}</div><div class="event-link">바로가기 →</div>`;
        grid.appendChild(el);
      });
    }
  }

  function renderSecondaryItems(items, type) {
    const grid = document.getElementById('newsGrid'); grid.innerHTML = '';
    if (!items.length) { grid.innerHTML = '<p class="blog-placeholder" style="color:var(--muted);text-align:center;padding:40px">검색 결과가 없습니다.</p>'; return; }
    const sourceClass = type === 'blog' ? 'card-source-blog' : 'card-source-cafe';
    items.forEach((item, i) => {
      const el = document.createElement('a');
      el.className = 'news-card'; el.href = item.link; el.target = '_blank'; el.rel = 'noopener';
      el.style.animationDelay = `${Math.min(i*0.03,0.5)}s`;
      let dateStr = item.postdate && item.postdate.length===8 ? `${item.postdate.slice(4,6)}/${item.postdate.slice(6,8)}` : '';
      el.innerHTML = `
        <div class="card-meta">
          ${item.source ? `<span class="${sourceClass}">[${esc(item.source)}]</span>` : ''}
          ${dateStr ? `<span class="card-date">${dateStr}</span>` : ''}
          ${type === 'blog' && item.likeId ? `<span class="card-like" data-lk="${esc(item.likeId)}">♥ …</span>` : ''}
        </div>
        <div class="card-title">${highlightKeyword(esc(item.title),'파이')}</div>
        ${item.desc ? `<div class="card-desc">${esc(item.desc.slice(0,200))}</div>` : ''}`;
      grid.appendChild(el);
    });
  }

  function resetGrid(msg) {
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('initLoader').style.display = 'flex';
    document.getElementById('initLoader').innerHTML = `<div class="loading-spinner"></div><p class="loading-text">${msg}</p>`;
  }

  function resetAndFetch() {
    document.getElementById('refreshBtn').classList.add('loading');
    blogLoaded = false; cafeLoaded = false; blogItems = []; cafeItems = []; eventsLoaded = false; blogStart = 1; blogEnd = false; blogPrefetch = null;
    if (currentMode !== 'event') initEventBadge();       // 다른 탭에 있어도 배지는 최신으로
    if (currentMode !== 'reviews') initReviewBadge();
    if (currentMode === 'blog') showBlog().catch(()=>{});
    else if (currentMode === 'cafe') showCafe().catch(()=>{});
    else if (currentMode === 'event') showEvents().then(markEventChangesSeen).catch(()=>{});
    else if (currentMode === 'referral') showReferral().catch(()=>{});
    else if (currentMode === 'reviews') { reviewsLoaded = false; showReviews().then(markReviewsSeen).catch(()=>{}); }
    else if (currentMode === 'taxnews') { taxLoaded = false; showTaxNews().catch(()=>{}); }
    else if (currentMode === 'press') { pressLoaded = false; showPress().catch(()=>{}); }
    else if (currentMode === 'stats') { statsLoaded = false; showStats().catch(()=>{}); }
    else { resetNews(); startLoad().catch(()=>{}); }
    setTimeout(() => document.getElementById('refreshBtn').classList.remove('loading'), 1500);
  }

  function resetNews() {
    allNews = []; renderedCount = 0; bgDone = false; rankCounter = 0; relatedLinks = new Set(); groups = [];
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('loadingBadge').classList.remove('active');
    document.getElementById('initLoader').style.display = 'flex';
    document.getElementById('initLoader').innerHTML = '<div class="loading-spinner"></div><p class="loading-text">뉴스를 불러오는 중...</p>';
    document.getElementById('totalLabel').textContent = '건의 뉴스';
    document.getElementById('sourceLabel').textContent = '개 매체';
    updateStats();
  }

  function updateStats() {
    document.getElementById('totalCount').textContent = allNews.length;
    document.getElementById('sourceCount').textContent = new Set(allNews.map(n=>n.source)).size;
  }

  function updateTime() {
    const now = new Date();
    document.getElementById('lastUpdated').textContent = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 업데이트`;
  }

  function formatDate(d) {
    if (!(d instanceof Date)||isNaN(d)) return '';
    const now = new Date();
    const diff = Math.floor((now - d)/60000);
    if (diff < 60) return `${diff}분 전`;
    if (diff < 1440) return `${Math.floor(diff/60)}시간 전`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function extractSource(url) {
    try {
      const host = new URL(url).hostname.replace('www.','');
      const map = {
        'chosun.com':'조선일보','joongang.co.kr':'중앙일보','joins.com':'중앙일보',
        'donga.com':'동아일보','hani.co.kr':'한겨레','hankookilbo.com':'한국일보',
        'khan.co.kr':'경향신문','mt.co.kr':'머니투데이','sedaily.com':'서울경제',
        'hankyung.com':'한국경제','mk.co.kr':'매일경제','yna.co.kr':'연합뉴스',
        'yonhapnews.co.kr':'연합뉴스','newsis.com':'뉴시스','news1.kr':'뉴스1',
        'ohmynews.com':'오마이뉴스','edaily.co.kr':'이데일리','etnews.com':'전자신문',
        'fnnews.com':'파이낸셜뉴스','heraldcorp.com':'헤럴드경제','asiae.co.kr':'아시아경제',
        'ajunews.com':'아주경제','etoday.co.kr':'이투데이','newspim.com':'뉴스핌',
        'dailian.co.kr':'데일리안','dt.co.kr':'디지털타임스','djtimes.co.kr':'디지털저널',
        'ddaily.co.kr':'디지털데일리','bloter.net':'블로터','zdnet.co.kr':'ZDNet',
        'itchosun.com':'IT조선','inews24.com':'아이뉴스24','nocutnews.co.kr':'노컷뉴스',
        'pressian.com':'프레시안','munhwa.com':'문화일보','seoul.co.kr':'서울신문',
        'segye.com':'세계일보','kmib.co.kr':'국민일보','kukinews.com':'쿠키뉴스',
        'imaeil.com':'매일신문','kookje.co.kr':'국제신문','busan.com':'부산일보',
        'jtbc.co.kr':'JTBC','ytn.co.kr':'YTN','mbn.co.kr':'MBN',
        'sbs.co.kr':'SBS','kbs.co.kr':'KBS','mbc.co.kr':'MBC',
        'ichannela.com':'채널A','tvchosun.com':'TV조선','thebell.co.kr':'더벨',
        'businesspost.co.kr':'비즈니스포스트','bizwatch.co.kr':'비즈워치',
        'tfmedia.co.kr':'더팩트','naeil.com':'내일신문','mediatoday.co.kr':'미디어오늘',
      };
      for (const [k,v] of Object.entries(map)) { if (host.includes(k)) return v; }
      return host.split('.')[0];
    } catch { return '언론사'; }
  }

  function highlightKeyword(str, kw) {
    if (!str||!kw) return str;
    const kws = (Array.isArray(kw) ? kw : [kw]).filter(Boolean);
    return kws.reduce((out, k) => {
      const safe = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return out.replace(new RegExp(safe, 'g'), `<span style="color:#f9a26c;font-weight:700;">${k}</span>`);
    }, str);
  }

  // 숫자를 넘겨도 죽지 않도록 문자열로 변환한다 ((str||'')는 숫자에서 .replace가 없어 터진다)
  function esc(str) { return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  if (!routeFromHash()) startLoad();
  initEventBadge();
  initReviewBadge();
  setInterval(resetAndFetch, 10*60*1000);
</script>
</body>
</html>
