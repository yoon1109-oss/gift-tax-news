<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>증여 최신 뉴스</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --card: #1c1c1c;
      --border: #2a2a2a;
      --accent: #c9a84c;
      --accent2: #e8c97a;
      --text: #e8e4dc;
      --muted: #7a7570;
      --tag-bg: #1e1a12;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .header-right { display: flex; align-items: center; gap: 16px; }

    .last-updated { font-size: 12px; color: var(--muted); }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 7px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover { background: var(--tag-bg); border-color: var(--accent); }
    .refresh-btn.loading svg { animation: spin 1s linear infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .hero {
      padding: 60px 40px 40px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #111008 0%, var(--bg) 100%);
    }

    .hero-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .hero-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .hero-title span { color: var(--accent); }

    .hero-desc { font-size: 15px; color: var(--muted); line-height: 1.7; max-width: 500px; }

    .filters {
      padding: 20px 40px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filter-label { font-size: 12px; color: var(--muted); margin-right: 4px; }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--tag-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .stats-bar {
      padding: 14px 40px;
      display: flex;
      gap: 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat-num { font-size: 20px; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--muted); }

    .news-container { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }

    .news-grid {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 800px;
      margin: 0 auto;
      gap: 16px;
    }

    .news-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.4s forwards;
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .news-card:hover {
      border-color: var(--accent);
      background: #1f1f1f;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }

    .card-source {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
      background: var(--tag-bg);
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid rgba(201,168,76,0.2);
      white-space: nowrap;
    }

    .card-date { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
      word-break: keep-all;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer { display: none; }

    .keyword-tag { font-size: 11px; padding: 2px 8px; border-radius: 2px; font-weight: 500; }
    .tag-gift { background: rgba(201,168,76,0.1); color: var(--accent); }
    .tag-tax { background: rgba(100,160,255,0.1); color: #7ab3f5; }

    .loading-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 40px; gap: 20px;
    }

    .loading-spinner {
      width: 40px; height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text { color: var(--muted); font-size: 14px; }

    .empty-state { text-align: center; padding: 80px 40px; color: var(--muted); }

    @media (max-width: 640px) {
      header { padding: 0 20px; }
      .hero { padding: 40px 20px 30px; }
      .filters, .stats-bar { padding: 14px 20px; }
      .news-container { padding: 20px; }
      .news-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    증여세 뉴스
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchNews()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      새로고침
    </button>
  </div>
</header>

<div class="hero">
  <div class="hero-label">실시간 뉴스 모니터링</div>
  <h1 class="hero-title">증여 <span>최신 뉴스</span></h1>
  <p class="hero-desc">증여 및 증여세 관련 최신 뉴스를 실시간으로 수집하여 제공합니다.</p>
</div>

<div class="filters">
  <span class="filter-label">필터</span>
  <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
  <button class="filter-btn" onclick="setFilter('증여', this)">증여</button>
  <button class="filter-btn" onclick="setFilter('한화생명', this)">한화생명 파이</button>
</div>

<div class="stats-bar">
  <div class="stat">
    <span class="stat-num" id="totalCount">—</span>
    <span class="stat-label">건의 뉴스</span>
  </div>
  <div class="stat">
    <span class="stat-num" id="sourceCount">—</span>
    <span class="stat-label">개 매체</span>
  </div>
</div>

<div class="news-container">
  <div id="newsContent">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p class="loading-text">뉴스를 불러오는 중...</p>
    </div>
  </div>
</div>

<script>
  let allNews = [];
  let currentFilter = 'all';

  async function fetchNews() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading');

    try {
      const keywords = ['증여', '한화생명 파이'];
      let results = [];

      for (const kw of keywords) {
        const res = await fetch(`/api/news?keyword=${encodeURIComponent(kw)}&display=50`);
        if (!res.ok) continue;
        const data = await res.json();

        (data.items || []).forEach(item => {
          const title = item.title.replace(/<[^>]*>/g, '').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
          const desc = item.description.replace(/<[^>]*>/g, '').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
          results.push({
            title,
            link: item.originallink || item.link,
            pubDate: new Date(item.pubDate),
            desc,
            source: extractSource(item.originallink || item.link),
            keyword: kw
          });
        });
      }

      // 제목에 '증여' 포함된 기사만
      results = results.filter(n => n.title.includes('증여'));

      // 중복 제거
      const seen = new Set();
      results = results.filter(n => {
        if (seen.has(n.link)) return false;
        seen.add(n.link);
        return true;
      });

      // 최근 3개월 필터
      const threeMonthsAgo = new Date();
      threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
      results = results.filter(n => n.pubDate >= threeMonthsAgo);

      // 최신순 정렬
      results.sort((a, b) => b.pubDate - a.pubDate);

      allNews = results;
      renderNews();
      updateStats();

      const now = new Date();
      document.getElementById('lastUpdated').textContent =
        `업데이트 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

    } catch(e) {
      document.getElementById('newsContent').innerHTML =
        `<div class="empty-state"><p>뉴스를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p></div>`;
    }

    btn.classList.remove('loading');
  }

  function cleanDesc(desc) {
    const parts = desc.split(/(?<=[.!?])\s+/);
    for (const s of parts) {
      const t = s.replace(/^[\u0022\u2018\u2019\u201c\u201d\s]+/, '').trim();
      if (t.length > 15 && !t.startsWith('&quot')) return t.slice(0, 150);
    }
    return desc.replace(/^[\u0022\u2018\u2019\u201c\u201d\s]+/, '').trim().slice(0, 150);
  }

  function extractSource(url) {
    try {
      const host = new URL(url).hostname.replace('www.', '');
      const map = {
        'chosun.com':'조선일보','joongang.co.kr':'중앙일보','donga.com':'동아일보',
        'hani.co.kr':'한겨레','hankookilbo.com':'한국일보','khan.co.kr':'경향신문',
        'mt.co.kr':'머니투데이','sedaily.com':'서울경제','hankyung.com':'한국경제',
        'mk.co.kr':'매일경제','yna.co.kr':'연합뉴스','newsis.com':'뉴시스',
        'news1.kr':'뉴스1','ohmynews.com':'오마이뉴스','edaily.co.kr':'이데일리',
        'etnews.com':'전자신문','fnnews.com':'파이낸셜뉴스','inews24.com':'아이뉴스24',
      };
      for (const [k, v] of Object.entries(map)) {
        if (host.includes(k)) return v;
      }
      return host.split('.')[0];
    } catch { return '언론사'; }
  }

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderNews();
  }

  function renderNews() {
    const filtered = currentFilter === 'all'
      ? allNews
      : allNews.filter(n => n.keyword === currentFilter || n.title.includes(currentFilter));

    if (filtered.length === 0) {
      document.getElementById('newsContent').innerHTML =
        `<div class="empty-state"><p>해당 키워드의 뉴스가 없습니다.</p></div>`;
      return;
    }

    const grid = filtered.map((n, i) => {
      const date = n.pubDate instanceof Date && !isNaN(n.pubDate) ? formatDate(n.pubDate) : '';
      const hasTax = n.title.includes('증여세');
      const tags = hasTax
        ? `<span class="keyword-tag tag-tax">증여세</span>`
        : `<span class="keyword-tag tag-gift">증여</span>`;

      return `
        <a class="news-card" href="${n.link}" target="_blank" rel="noopener"
           style="animation-delay:${i * 0.03}s">
          <div class="card-top">
            <span class="card-source">${esc(n.source)}</span>
            <span class="card-date">${date}</span>
          </div>
          <div class="card-title">${esc(n.title)}</div>
          ${n.desc ? `<div class="card-desc">${esc(n.desc.slice(0,120))}...</div>` : ''}
          <div class="card-footer">${tags}</div>
        </a>`;
    }).join('');

    document.getElementById('newsContent').innerHTML = `<div class="news-grid">${grid}</div>`;
  }

  function updateStats() {
    const sources = new Set(allNews.map(n => n.source));
    document.getElementById('totalCount').textContent = allNews.length;
    document.getElementById('sourceCount').textContent = sources.size;
  }

  function formatDate(d) {
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 60) return `${diff}분 전`;
    if (diff < 1440) return `${Math.floor(diff/60)}시간 전`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  fetchNews();
  setInterval(fetchNews, 10 * 60 * 1000);
</script>
</body>
</html>
