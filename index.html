<!DOCTYPE html>
<html lang="ko"> 
<head>
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>증여 최신 뉴스</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d; --surface: #161616; --card: #1c1c1c;
      --border: #2a2a2a; --accent: #c9a84c; --text: #e8e4dc;
      --muted: #7a7570; --tag-bg: #1e1a12;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

    header {
      border-bottom: 1px solid var(--border); padding: 0 40px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; position: sticky; top: 0;
      background: rgba(13,13,13,0.95); backdrop-filter: blur(10px); z-index: 100;
    }
    .logo { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .last-updated { font-size: 12px; color: var(--muted); }
    .refresh-btn {
      background: transparent; border: 1px solid var(--border); color: var(--accent);
      padding: 7px 16px; border-radius: 4px; font-size: 13px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .refresh-btn:hover { background: var(--tag-bg); border-color: var(--accent); }
    .refresh-btn.loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .hero { padding: 48px 40px 36px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg,#111008 0%,var(--bg) 100%); }
    .hero-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; }
    .hero-title { font-family: 'Noto Serif KR', serif; font-size: clamp(28px,4vw,44px); font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
    .hero-title span { color: var(--accent); }
    .hero-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }

    .filters {
      padding: 14px 40px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .filter-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .radio-wrap {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: 13px; color: var(--muted); border: 1px solid var(--border);
      padding: 6px 16px; border-radius: 20px; transition: all 0.2s; user-select: none;
    }
    .radio-wrap:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    .radio-wrap.checked { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    .radio-wrap input[type="radio"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

    .stats-bar { padding: 12px 40px; display: flex; gap: 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat-num { font-size: 18px; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--muted); }
    .loading-badge { font-size: 11px; color: var(--muted); display: none; align-items: center; gap: 6px; }
    .loading-badge.active { display: flex; }
    .mini-spinner { width: 12px; height: 12px; border: 1.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

    .news-container { padding: 28px 40px; max-width: 860px; margin: 0 auto; }
    .news-grid { display: flex; flex-direction: column; gap: 14px; }

    .news-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 20px 24px; transition: all 0.22s;
      display: flex; flex-direction: column; gap: 8px;
      text-decoration: none; color: inherit;
      opacity: 0; transform: translateY(10px); animation: fadeUp 0.35s forwards;
    }
    @keyframes fadeUp { to{opacity:1;transform:translateY(0)} }
    .news-card:hover { border-color: var(--accent); background: #202020; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    .card-meta { display: flex; align-items: center; gap: 10px; }
    .card-source { font-size: 11px; color: var(--accent); font-weight: 500; background: var(--tag-bg); padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(201,168,76,.2); }
    .card-date { font-size: 11px; color: var(--muted); }
    .card-title { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 600; line-height: 1.55; word-break: keep-all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.75; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .init-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; gap: 20px; }
    .loading-spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-text { color: var(--muted); font-size: 14px; }
    .scroll-sentinel { height: 1px; }
    .scroll-loader { display: none; justify-content: center; padding: 24px; }
    .scroll-loader .loading-spinner { width: 26px; height: 26px; }
    .end-msg { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 8px; display: none; }

    .content-tabs {
      display: none; padding: 10px 40px; gap: 8px;
      border-bottom: 1px solid var(--border); background: var(--surface);
      align-items: center; flex-wrap: wrap;
    }
    .content-tabs.visible { display: flex; }
    .content-tab {
      font-size: 13px; color: var(--muted); border: 1px solid var(--border);
      padding: 6px 16px; border-radius: 20px; cursor: pointer;
      transition: all 0.2s; user-select: none;
    }
    .content-tab:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    .content-tab.active { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    .card-source-blog { font-size: 11px; color: #6ea8fe; font-weight: 500; background: #0d1f3c; padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(110,168,254,.2); }
    .card-source-cafe { font-size: 11px; color: #a3e635; font-weight: 500; background: #0d1f0d; padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(163,230,53,.2); }

    @media (max-width: 640px) {
      header, .hero, .filters, .stats-bar, .content-tabs { padding-left: 20px; padding-right: 20px; }
      .news-container { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>증여 최신 뉴스</div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="resetAndFetch()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      새로고침
    </button>
  </div>
</header>

<div class="hero">
  <div class="hero-label">실시간 뉴스 모니터링</div>
  <h1 class="hero-title">증여 <span>최신 뉴스</span></h1>
  <p class="hero-desc">'증여' 키워드 최신 뉴스를 최신순으로 제공합니다.</p>
</div>

<div class="filters">
  <span class="filter-label">조회</span>
  <label class="radio-wrap checked" id="wrap-all">
    <input type="radio" name="newsFilter" value="all" checked onchange="onModeChange('all')">
    <span>증여 기사</span>
  </label>
  <label class="radio-wrap" id="wrap-hanwha">
    <input type="radio" name="newsFilter" value="hanwha" onchange="onModeChange('hanwha')">
    <span>파이 기사</span>
  </label>
  <label class="radio-wrap" id="wrap-pie-news">
    <input type="radio" name="newsFilter" value="pie-news" onchange="onModeChange('pie-news')">
    <span>파이 뉴스</span>
  </label>
  <label class="radio-wrap" id="wrap-blog">
    <input type="radio" name="newsFilter" value="blog" onchange="onModeChange('blog')">
    <span>파이 블로그</span>
  </label>
  <label class="radio-wrap" id="wrap-cafe">
    <input type="radio" name="newsFilter" value="cafe" onchange="onModeChange('cafe')">
    <span>파이 카페</span>
  </label>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="totalCount">—</span><span class="stat-label" id="totalLabel">건의 뉴스</span></div>
  <div class="stat"><span class="stat-num" id="sourceCount">—</span><span class="stat-label" id="sourceLabel">개 매체</span></div>
  <div class="loading-badge" id="loadingBadge"><div class="mini-spinner"></div><span>백그라운드 로딩 중...</span></div>
</div>

<div class="news-container">
  <div id="newsGrid" class="news-grid"></div>
  <div class="scroll-sentinel" id="sentinel"></div>
  <div class="scroll-loader" id="scrollLoader"><div class="loading-spinner"></div></div>
  <div class="end-msg" id="endMsg">모든 뉴스를 불러왔습니다.</div>
  <div class="init-loader" id="initLoader"><div class="loading-spinner"></div><p class="loading-text">뉴스를 불러오는 중...</p></div>
</div>

<script>
  const PAGE_SIZE = 30;

  let allNews = [];
  let renderedCount = 0;
  let currentMode = 'all'; // 'all' | 'hanwha' | 'pie-news' | 'blog' | 'cafe'
  let bgDone = false;
  let blogItems = [];
  let cafeItems = [];
  let blogLoaded = false;
  let cafeLoaded = false;

  function getKeyword() {
    return currentMode === 'all' ? '증여' : '한화생명 파이';
  }

  function cleanItem(item) {
    const clean = s => (s || '').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#\d+;/g,'');
    return {
      title: clean(item.title),
      desc: clean(item.description),
      link: item.originallink || item.link,
      pubDate: new Date(item.pubDate),
      source: extractSource(item.originallink || item.link)
    };
  }

  async function fetchBatch(keyword, start) {
    const sort = 'date';
    const res = await fetch(`/api/news?keyword=${encodeURIComponent(keyword)}&display=100&start=${start}&sort=${sort}`);
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    return data.items || [];
  }

  async function startLoad() {
    const keyword = getKeyword();
    bgDone = false;

    // 1단계: 첫 배치 로드 후 즉시 화면에 표시
    try {
      const items = await fetchBatch(keyword, 1);
      const links = new Set();
      items.forEach(item => {
        const n = cleanItem(item);
        if (!links.has(n.link)) {
          // 한화생명 파이 모드: 제목 또는 본문에 '한화생명' 실제 포함된 기사만
          if (currentMode === 'hanwha' && !n.title.includes('한화생명') && !n.desc.includes('한화생명')) return;
          links.add(n.link);
          allNews.push(n);
        }
      });
      allNews.sort((a, b) => b.pubDate - a.pubDate);

      document.getElementById('initLoader').style.display = 'none';
      renderNextPage();
      updateStats();
      updateTime();

      if (items.length < 100) {
        bgDone = true;
        checkEnd();
        return;
      }
    } catch(e) {
      console.error('초기 로드 실패:', e);
      document.getElementById('initLoader').style.display = 'none';
      document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">뉴스를 불러오지 못했습니다. 새로고침해주세요.</p>';
      document.getElementById('initLoader').style.display = 'flex';
      return;
    }

    // 2단계: 백그라운드에서 나머지 로드
    document.getElementById('loadingBadge').classList.add('active');
    const existingLinks = new Set(allNews.map(n => n.link));

    for (let start = 101; start <= 201; start += 100) {
      if (currentMode !== (document.querySelector('input[name="newsFilter"]:checked')?.value || 'all')) break;
      try {
        const items = await fetchBatch(keyword, start);
        items.forEach(item => {
          const n = cleanItem(item);
          if (!existingLinks.has(n.link)) {
            // 한화생명 파이 모드: 제목 또는 본문에 '한화생명' 실제 포함된 기사만
            if (currentMode === 'hanwha' && !n.title.includes('한화생명') && !n.desc.includes('한화생명')) return;
            existingLinks.add(n.link);
            allNews.push(n);
          }
        });
        allNews.sort((a, b) => b.pubDate - a.pubDate);
        updateStats();
        if (items.length < 100) break;
      } catch(e) {
        console.error('백그라운드 로드 실패:', e);
        break;
      }
    }

    bgDone = true;
    document.getElementById('loadingBadge').classList.remove('active');
    updateStats();
    checkEnd();
  }

  function renderNextPage() {
    if (currentMode === 'blog' || currentMode === 'cafe') return;
    const slice = allNews.slice(renderedCount, renderedCount + PAGE_SIZE);
    if (slice.length === 0) { checkEnd(); return; }

    const grid = document.getElementById('newsGrid');
    const kw = currentMode === 'all' ? '증여' : '한화생명';
    slice.forEach((n, i) => {
      const el = document.createElement('a');
      el.className = 'news-card';
      el.href = n.link;
      el.target = '_blank';
      el.rel = 'noopener';
      el.style.animationDelay = `${Math.min(i * 0.04, 0.5)}s`;
      el.innerHTML = `
        <div class="card-meta">
          <span class="card-source">${esc(n.source)}</span>
          <span class="card-date">${formatDate(n.pubDate)}</span>
        </div>
        <div class="card-title">${highlightKeyword(esc(n.title), kw)}</div>
        ${n.desc ? `<div class="card-desc">${esc(n.desc.slice(0, 200))}</div>` : ''}
      `;
      grid.appendChild(el);
    });
    renderedCount += slice.length;
    checkEnd();
  }

  function checkEnd() {
    const hasMore = renderedCount < allNews.length;
    document.getElementById('scrollLoader').style.display = (hasMore || !bgDone) ? 'none' : 'none';
    document.getElementById('endMsg').style.display = (bgDone && !hasMore) ? 'block' : 'none';
  }

  // 스크롤 감지
  const observer = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    if (currentMode === 'blog' || currentMode === 'cafe') return;
    if (renderedCount < allNews.length) {
      renderNextPage();
    }
  }, { rootMargin: '400px' });
  observer.observe(document.getElementById('sentinel'));

  function onModeChange(mode) {
    currentMode = mode;
    document.querySelectorAll('.radio-wrap').forEach(w => w.classList.remove('checked'));
    document.getElementById('wrap-' + mode).classList.add('checked');

    if (mode === 'blog') {
      blogLoaded = false;
      blogItems = [];
      showBlog();
    } else if (mode === 'cafe') {
      cafeLoaded = false;
      cafeItems = [];
      showCafe();
    } else {
      resetNews();
      startLoad();
    }
  }

  function cleanHtml(s) {
    return (s || '').replace(/<[^>]*>/g, '').replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#\d+;/g, '').replace(/&apos;/g, "'");
  }

  async function showBlog() {
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('scrollLoader').style.display = 'none';
    document.getElementById('initLoader').style.display = 'flex';
    document.getElementById('initLoader').innerHTML = '<div class="loading-spinner"></div><p class="loading-text">블로그 글을 불러오는 중...</p>';

    if (!blogLoaded) {
      try {
        const res = await fetch(`/api/blog?keyword=${encodeURIComponent('한화생명 파이')}&display=100&sort=date`);
        const data = await res.json();
        blogItems = (data.items || []).map(item => ({
          title: cleanHtml(item.title),
          desc: cleanHtml(item.description),
          link: item.link,
          source: item.bloggername || '블로그',
          postdate: item.postdate || '',
        }));
        blogLoaded = true;
      } catch (e) {
        console.error('블로그 로드 실패:', e);
        document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">블로그를 불러오지 못했습니다. 새로고침해주세요.</p>';
        return;
      }
    }

    document.getElementById('initLoader').style.display = 'none';
    renderSecondaryItems(blogItems, 'blog');
    document.getElementById('totalCount').textContent = blogItems.length;
    document.getElementById('totalLabel').textContent = '건의 블로그';
    document.getElementById('sourceCount').textContent = new Set(blogItems.map(n => n.source)).size;
    document.getElementById('sourceLabel').textContent = '개 블로그';
    document.getElementById('endMsg').style.display = blogItems.length > 0 ? 'block' : 'none';
  }

  async function showCafe() {
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('scrollLoader').style.display = 'none';
    document.getElementById('initLoader').style.display = 'flex';
    document.getElementById('initLoader').innerHTML = '<div class="loading-spinner"></div><p class="loading-text">카페 글을 불러오는 중...</p>';

    if (!cafeLoaded) {
      try {
        const res = await fetch(`/api/cafe?keyword=${encodeURIComponent('한화생명 파이')}&display=100&sort=date`);
        const data = await res.json();
        cafeItems = (data.items || []).map(item => ({
          title: cleanHtml(item.title),
          desc: cleanHtml(item.description),
          link: item.link,
          source: item.cafename || '카페',
          postdate: '',
        }));
        cafeLoaded = true;
      } catch (e) {
        console.error('카페 로드 실패:', e);
        document.getElementById('initLoader').innerHTML = '<p style="color:var(--muted)">카페를 불러오지 못했습니다. 새로고침해주세요.</p>';
        return;
      }
    }

    document.getElementById('initLoader').style.display = 'none';
    renderSecondaryItems(cafeItems, 'cafe');
    document.getElementById('totalCount').textContent = cafeItems.length;
    document.getElementById('totalLabel').textContent = '건의 카페글';
    document.getElementById('sourceCount').textContent = new Set(cafeItems.map(n => n.source)).size;
    document.getElementById('sourceLabel').textContent = '개 카페';
    document.getElementById('endMsg').style.display = cafeItems.length > 0 ? 'block' : 'none';
  }

  function renderSecondaryItems(items, type) {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = '';

    if (items.length === 0) {
      grid.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">검색 결과가 없습니다.</p>';
      return;
    }

    const sourceClass = type === 'blog' ? 'card-source-blog' : 'card-source-cafe';

    items.forEach((item, i) => {
      const el = document.createElement('a');
      el.className = 'news-card';
      el.href = item.link;
      el.target = '_blank';
      el.rel = 'noopener';
      el.style.animationDelay = `${Math.min(i * 0.03, 0.5)}s`;

      let dateStr = '';
      if (item.postdate && item.postdate.length === 8) {
        dateStr = `${item.postdate.slice(4, 6)}/${item.postdate.slice(6, 8)}`;
      }

      el.innerHTML = `
        <div class="card-meta">
          <span class="${sourceClass}">${esc(item.source)}</span>
          ${dateStr ? `<span class="card-date">${dateStr}</span>` : ''}
        </div>
        <div class="card-title">${highlightKeyword(esc(item.title), '한화생명')}</div>
        ${item.desc ? `<div class="card-desc">${esc(item.desc.slice(0, 200))}</div>` : ''}
      `;
      grid.appendChild(el);
    });
  }

  function resetAndFetch() {
    document.getElementById('refreshBtn').classList.add('loading');
    blogLoaded = false;
    cafeLoaded = false;
    blogItems = [];
    cafeItems = [];
    if (currentMode === 'blog') {
      showBlog().then(() => {}).catch(() => {});
    } else if (currentMode === 'cafe') {
      showCafe().then(() => {}).catch(() => {});
    } else {
      resetNews();
      startLoad().then(() => {}).catch(() => {});
    }
    setTimeout(() => document.getElementById('refreshBtn').classList.remove('loading'), 1500);
  }

  function resetNews() {
    allNews = [];
    renderedCount = 0;
    bgDone = false;
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('scrollLoader').style.display = 'none';
    document.getElementById('loadingBadge').classList.remove('active');
    document.getElementById('initLoader').style.display = 'flex';
    document.getElementById('initLoader').innerHTML = '<div class="loading-spinner"></div><p class="loading-text">뉴스를 불러오는 중...</p>';
    document.getElementById('totalLabel').textContent = '건의 뉴스';
    document.getElementById('sourceLabel').textContent = '개 매체';
    updateStats();
  }

  function reset() { resetNews(); }

  function updateStats() {
    document.getElementById('totalCount').textContent = allNews.length;
    document.getElementById('sourceCount').textContent = new Set(allNews.map(n => n.source)).size;
  }

  function updateTime() {
    const now = new Date();
    document.getElementById('lastUpdated').textContent =
      `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 업데이트`;
  }

  function extractSource(url) {
    try {
      const host = new URL(url).hostname.replace('www.','');
      const map = {
        'chosun.com':'조선일보','joongang.co.kr':'중앙일보','donga.com':'동아일보',
        'hani.co.kr':'한겨레','hankookilbo.com':'한국일보','khan.co.kr':'경향신문',
        'mt.co.kr':'머니투데이','sedaily.com':'서울경제','hankyung.com':'한국경제',
        'mk.co.kr':'매일경제','yna.co.kr':'연합뉴스','newsis.com':'뉴시스',
        'news1.kr':'뉴스1','ohmynews.com':'오마이뉴스','edaily.co.kr':'이데일리',
        'etnews.com':'전자신문','fnnews.com':'파이낸셜뉴스',
      };
      for (const [k,v] of Object.entries(map)) { if (host.includes(k)) return v; }
      return host.split('.')[0];
    } catch { return '언론사'; }
  }

  function formatDate(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 60) return `${diff}분 전`;
    if (diff < 1440) return `${Math.floor(diff/60)}시간 전`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function highlightKeyword(str, kw) {
    if (!str) return '';
    return str.replace(new RegExp(kw, 'g'), `<span style="color:#f97316;font-weight:700;">${kw}</span>`);
  }

  function esc(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // 초기 실행
  startLoad();
  setInterval(resetAndFetch, 10 * 60 * 1000);
</script>
</body>
</html>
