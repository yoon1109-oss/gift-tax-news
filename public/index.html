<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>증여 최신 뉴스</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d; --surface: #161616; --card: #1c1c1c;
      --border: #2a2a2a; --accent: #c9a84c; --text: #e8e4dc;
      --muted: #7a7570; --tag-bg: #1e1a12;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

    header {
      border-bottom: 1px solid var(--border); padding: 0 40px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; position: sticky; top: 0;
      background: rgba(13,13,13,0.95); backdrop-filter: blur(10px); z-index: 100;
    }
    .logo { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .last-updated { font-size: 12px; color: var(--muted); }
    .refresh-btn {
      background: transparent; border: 1px solid var(--border); color: var(--accent);
      padding: 7px 16px; border-radius: 4px; font-size: 13px; cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .refresh-btn:hover { background: var(--tag-bg); border-color: var(--accent); }
    .refresh-btn.loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .hero { padding: 48px 40px 36px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg,#111008 0%,var(--bg) 100%); }
    .hero-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; font-weight: 500; }
    .hero-title { font-family: 'Noto Serif KR', serif; font-size: clamp(28px,4vw,44px); font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
    .hero-title span { color: var(--accent); }
    .hero-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }

    .filters {
      padding: 14px 40px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .filter-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .radio-wrap {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: 13px; color: var(--muted); border: 1px solid var(--border);
      padding: 6px 16px; border-radius: 20px; transition: all 0.2s; user-select: none;
    }
    .radio-wrap:hover { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    .radio-wrap.checked { border-color: var(--accent); color: var(--accent); background: var(--tag-bg); }
    .radio-wrap input[type="radio"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

    .stats-bar { padding: 12px 40px; display: flex; gap: 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat-num { font-size: 18px; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--muted); }

    .news-container { padding: 28px 40px; max-width: 860px; margin: 0 auto; }
    .news-grid { display: flex; flex-direction: column; gap: 14px; }

    .news-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 20px 24px; cursor: pointer; transition: all 0.22s;
      display: flex; flex-direction: column; gap: 8px;
      text-decoration: none; color: inherit;
      opacity: 0; transform: translateY(10px); animation: fadeUp 0.35s forwards;
    }
    @keyframes fadeUp { to{opacity:1;transform:translateY(0)} }
    .news-card:hover { border-color: var(--accent); background: #202020; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    .card-meta { display: flex; align-items: center; gap: 10px; }
    .card-source { font-size: 11px; color: var(--accent); font-weight: 500; background: var(--tag-bg); padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(201,168,76,.2); }
    .card-date { font-size: 11px; color: var(--muted); }
    .card-title { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 600; line-height: 1.55; word-break: keep-all; color: var(--text); }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.75; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; gap: 20px; }
    .loading-spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-text { color: var(--muted); font-size: 14px; }
    .scroll-loader { display: flex; justify-content: center; padding: 32px; }
    .scroll-loader .loading-spinner { width: 28px; height: 28px; }
    .empty-state { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
    .end-msg { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 8px; }

    @media (max-width: 640px) {
      header, .hero, .filters, .stats-bar { padding-left: 20px; padding-right: 20px; }
      .news-container { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>증여 최신 뉴스</div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="resetAndFetch()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      새로고침
    </button>
  </div>
</header>

<div class="hero">
  <div class="hero-label">실시간 뉴스 모니터링</div>
  <h1 class="hero-title">증여 <span>최신 뉴스</span></h1>
  <p class="hero-desc">'증여' 키워드 최신 뉴스를 최신순으로 제공합니다.</p>
</div>

<div class="filters">
  <span class="filter-label">조회</span>
  <label class="radio-wrap checked" id="wrap-all">
    <input type="radio" name="newsFilter" id="radio-all" value="all" checked onchange="onModeChange('all')">
    <span>전체</span>
  </label>
  <label class="radio-wrap" id="wrap-hanwha">
    <input type="radio" name="newsFilter" id="radio-hanwha" value="hanwha" onchange="onModeChange('hanwha')">
    <span>한화생명 파이</span>
  </label>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="totalCount">—</span><span class="stat-label">건의 뉴스</span></div>
  <div class="stat"><span class="stat-num" id="sourceCount">—</span><span class="stat-label">개 매체</span></div>
</div>

<div class="news-container">
  <div id="newsGrid" class="news-grid"></div>
  <div id="scrollLoader" class="scroll-loader" style="display:none"><div class="loading-spinner"></div></div>
  <div id="endMsg" class="end-msg" style="display:none">모든 뉴스를 불러왔습니다.</div>
  <div id="initLoader" class="loading-state"><div class="loading-spinner"></div><p class="loading-text">뉴스를 불러오는 중...</p></div>
</div>

<script>
  const PAGE_SIZE = 30;
  const MAX_START = 1000; // 네이버 API 최대

  let allNews = [];
  let renderedCount = 0;
  let apiStart = 1;
  let apiDone = false;
  let isLoadingAll = false;
  let currentMode = 'all';

  function getKeyword() {
    return currentMode === 'hanwha' ? '한화생명 파이' : '증여';
  }

  // 백그라운드에서 1000건 전체 로드
  async function loadAll() {
    if (isLoadingAll) return;
    isLoadingAll = true;

    while (!apiDone) {
      try {
        const keyword = getKeyword();
        const res = await fetch(`/api/news?keyword=${encodeURIComponent(keyword)}&display=100&start=${apiStart}`);
        if (!res.ok) break;
        const data = await res.json();
        const items = data.items || [];

        if (items.length < 100) apiDone = true;
        if (apiStart >= MAX_START) apiDone = true;

        const existingLinks = new Set(allNews.map(n => n.link));
        items.forEach(item => {
          const title = (item.title || '').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#\d+;/g,'');
          const desc = (item.description || '').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#\d+;/g,'');
          const link = item.originallink || item.link;
          const pubDate = new Date(item.pubDate);
          if (!existingLinks.has(link)) {
            allNews.push({ title, desc, link, pubDate, source: extractSource(link) });
          }
        });

        apiStart += 100;
        allNews.sort((a, b) => b.pubDate - a.pubDate);
        updateStats();

      } catch(e) {
        console.error(e);
        break;
      }
    }

    isLoadingAll = false;
    updateStats();
    if (renderedCount >= allNews.length) {
      document.getElementById('endMsg').style.display = 'block';
    }
    document.getElementById('scrollLoader').style.display = 'none';
  }

  // 초기 30건 렌더 후 백그라운드 전체 로드 시작
  async function initialLoad() {
    document.getElementById('initLoader').style.display = 'flex';
    try {
      const keyword = getKeyword();
      const res = await fetch(`/api/news?keyword=${encodeURIComponent(keyword)}&display=100&start=1`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      const items = data.items || [];

      if (items.length < 100) apiDone = true;

      items.forEach(item => {
        const title = (item.title || '').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#\d+;/g,'');
        const desc = (item.description || '').replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#\d+;/g,'');
        const link = item.originallink || item.link;
        const pubDate = new Date(item.pubDate);
        allNews.push({ title, desc, link, pubDate, source: extractSource(link) });
      });

      apiStart = 101;
      allNews.sort((a, b) => b.pubDate - a.pubDate);

      document.getElementById('initLoader').style.display = 'none';
      renderNextPage(); // 첫 30건 렌더
      updateStats();

      const now = new Date();
      document.getElementById('lastUpdated').textContent =
        `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 업데이트`;

      // 백그라운드에서 나머지 900건 로드
      if (!apiDone) loadAll();

    } catch(e) {
      console.error(e);
      document.getElementById('initLoader').style.display = 'none';
    }
  }

  function renderNextPage() {
    const slice = allNews.slice(renderedCount, renderedCount + PAGE_SIZE);
    if (slice.length === 0) {
      if (apiDone) document.getElementById('endMsg').style.display = 'block';
      return;
    }
    const grid = document.getElementById('newsGrid');
    slice.forEach((n, i) => {
      const el = document.createElement('a');
      el.className = 'news-card';
      el.href = n.link;
      el.target = '_blank';
      el.rel = 'noopener';
      el.style.animationDelay = `${Math.min(i * 0.03, 0.4)}s`;
      el.innerHTML = `
        <div class="card-meta">
          <span class="card-source">${esc(n.source)}</span>
          <span class="card-date">${formatDate(n.pubDate)}</span>
        </div>
        <div class="card-title">${esc(n.title)}</div>
        ${n.desc ? `<div class="card-desc">${esc(n.desc.slice(0,200))}</div>` : ''}
      `;
      grid.appendChild(el);
    });
    renderedCount += slice.length;
    if (renderedCount >= allNews.length && apiDone) {
      document.getElementById('endMsg').style.display = 'block';
    }
  }

  // 스크롤 내릴 때 렌더된 게 30개 이상이면 추가 렌더
  const observer = new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting) return;
    if (renderedCount < allNews.length) {
      renderNextPage();
    } else if (apiDone) {
      document.getElementById('endMsg').style.display = 'block';
      document.getElementById('scrollLoader').style.display = 'none';
    }
    // 백그라운드 로딩 중이면 스피너 유지
    if (!apiDone && isLoadingAll) {
      document.getElementById('scrollLoader').style.display = 'flex';
    }
  }, { rootMargin: '300px' });
  observer.observe(document.getElementById('scrollLoader'));

  function onModeChange(mode) {
    currentMode = mode;
    document.querySelectorAll('.radio-wrap').forEach(w => w.classList.remove('checked'));
    document.getElementById('wrap-' + mode).classList.add('checked');
    allNews = []; renderedCount = 0; apiStart = 1; apiDone = false; isLoadingAll = false;
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('scrollLoader').style.display = 'none';
    initialLoad();
  }

  function resetAndFetch() {
    document.getElementById('refreshBtn').classList.add('loading');
    allNews = []; renderedCount = 0; apiStart = 1; apiDone = false; isLoadingAll = false;
    document.getElementById('newsGrid').innerHTML = '';
    document.getElementById('endMsg').style.display = 'none';
    document.getElementById('scrollLoader').style.display = 'none';
    initialLoad().then ? initialLoad().then(() => document.getElementById('refreshBtn').classList.remove('loading'))
      : initialLoad();
    setTimeout(() => document.getElementById('refreshBtn').classList.remove('loading'), 2000);
  }

  function updateStats() {
    document.getElementById('totalCount').textContent = allNews.length;
    const sources = new Set(allNews.map(n => n.source));
    document.getElementById('sourceCount').textContent = sources.size;
  }

  function extractSource(url) {
    try {
      const host = new URL(url).hostname.replace('www.','');
      const map = {
        'chosun.com':'조선일보','joongang.co.kr':'중앙일보','donga.com':'동아일보',
        'hani.co.kr':'한겨레','hankookilbo.com':'한국일보','khan.co.kr':'경향신문',
        'mt.co.kr':'머니투데이','sedaily.com':'서울경제','hankyung.com':'한국경제',
        'mk.co.kr':'매일경제','yna.co.kr':'연합뉴스','newsis.com':'뉴시스',
        'news1.kr':'뉴스1','ohmynews.com':'오마이뉴스','edaily.co.kr':'이데일리',
        'etnews.com':'전자신문','fnnews.com':'파이낸셜뉴스',
      };
      for (const [k,v] of Object.entries(map)) { if (host.includes(k)) return v; }
      return host.split('.')[0];
    } catch { return '언론사'; }
  }

  function formatDate(d) {
    if (!(d instanceof Date) || isNaN(d)) return '';
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 60) return `${diff}분 전`;
    if (diff < 1440) return `${Math.floor(diff/60)}시간 전`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function esc(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // 초기 로드
  fetchPage();
  setInterval(resetAndFetch, 10 * 60 * 1000);
</script>
</body>
</html>
